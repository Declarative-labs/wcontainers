<!doctype html>
<meta charset="utf-8">
<title>Triangle</title>
<script type="module">
// The triangle scene of crates/wcontainers-graphics-test/src/scene.rs, drawn by WebGPU or WebGL 2
// (?api=webgpu or ?api=webgl2; nothing without one) into an offscreen 256 by 256 RGBA8 target and read back as a PNG.
// window.result resolves to { adapter, png } with png a data URL.
const SIZE = 256;
const CLEAR = [26 / 255, 26 / 255, 38 / 255, 1];
// position x, y and colour r, g, b
const TRIANGLE = new Float32Array([
  0.0, 0.8, 1.0, 0.0, 0.0,
  0.8, -0.7, 0.0, 1.0, 0.0,
  -0.8, -0.7, 0.0, 0.0, 1.0,
]);

async function webgpu() {
  const adapter = await navigator.gpu?.requestAdapter();
  if (!adapter) throw new Error('no WebGPU adapter');
  const device = await adapter.requestDevice();
  device.addEventListener('uncapturederror', (e) => { window.gpuError = e.error.message; });
  const module = device.createShaderModule({ code: await (await fetch('triangle.wgsl')).text() });
  const pipeline = device.createRenderPipeline({
    layout: 'auto',
    vertex: {
      module, entryPoint: 'vs',
      buffers: [{ arrayStride: 20, attributes: [
        { shaderLocation: 0, offset: 0, format: 'float32x2' },
        { shaderLocation: 1, offset: 8, format: 'float32x3' },
      ] }],
    },
    fragment: { module, entryPoint: 'ps', targets: [{ format: 'rgba8unorm' }] },
  });
  const vertices = device.createBuffer({ size: TRIANGLE.byteLength, usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST });
  device.queue.writeBuffer(vertices, 0, TRIANGLE);
  const target = device.createTexture({ size: [SIZE, SIZE], format: 'rgba8unorm', usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
  const readback = device.createBuffer({ size: SIZE * SIZE * 4, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
  const encoder = device.createCommandEncoder();
  const pass = encoder.beginRenderPass({ colorAttachments: [{
    view: target.createView(), loadOp: 'clear', storeOp: 'store',
    clearValue: { r: CLEAR[0], g: CLEAR[1], b: CLEAR[2], a: CLEAR[3] },
  }] });
  pass.setPipeline(pipeline);
  pass.setVertexBuffer(0, vertices);
  pass.draw(3);
  pass.end();
  encoder.copyTextureToBuffer({ texture: target }, { buffer: readback, bytesPerRow: SIZE * 4 }, [SIZE, SIZE]);
  device.queue.submit([encoder.finish()]);
  await readback.mapAsync(GPUMapMode.READ);
  const texels = new Uint8ClampedArray(readback.getMappedRange().slice(0));
  if (window.gpuError) throw new Error(window.gpuError);
  const info = adapter.info;
  const adapterName = [info.description || `${info.vendor} ${info.architecture}`, info.backend, info.type, info.isFallbackAdapter ? 'fallback' : '']
    .filter(Boolean).join(', ');
  return { adapter: adapterName, texels };
}

function webgl2() {
  const gl = new OffscreenCanvas(SIZE, SIZE).getContext('webgl2', { antialias: false });
  if (!gl) throw new Error('no WebGL 2 context');
  const shader = (type, source) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, source);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const program = gl.createProgram();
  gl.attachShader(program, shader(gl.VERTEX_SHADER, `#version 300 es
    layout(location = 0) in vec2 pos;
    layout(location = 1) in vec3 color;
    out vec3 v_color;
    void main() { v_color = color; gl_Position = vec4(pos, 0.0, 1.0); }`));
  gl.attachShader(program, shader(gl.FRAGMENT_SHADER, `#version 300 es
    precision highp float;
    in vec3 v_color;
    out vec4 o;
    void main() { o = vec4(v_color, 1.0); }`));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));

  const framebuffer = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
  const target = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, target);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.RGBA8, SIZE, SIZE);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, target);
  gl.viewport(0, 0, SIZE, SIZE);
  gl.clearColor(...CLEAR);
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, TRIANGLE, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 20, 0);
  gl.enableVertexAttribArray(1);
  gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 20, 8);
  gl.useProgram(program);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // WebGL reads rows bottom first; the other renderers' pictures start at the top.
  const bottomUp = new Uint8Array(SIZE * SIZE * 4);
  gl.readPixels(0, 0, SIZE, SIZE, gl.RGBA, gl.UNSIGNED_BYTE, bottomUp);
  const texels = new Uint8ClampedArray(SIZE * SIZE * 4);
  for (let y = 0; y < SIZE; y++) {
    texels.set(bottomUp.subarray((SIZE - 1 - y) * SIZE * 4, (SIZE - y) * SIZE * 4), y * SIZE * 4);
  }
  if (gl.getError() !== gl.NO_ERROR) throw new Error('WebGL error');
  const debug = gl.getExtension('WEBGL_debug_renderer_info');
  const adapter = debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
  return { adapter, texels };
}

async function png(texels) {
  const canvas = new OffscreenCanvas(SIZE, SIZE);
  canvas.getContext('2d').putImageData(new ImageData(texels, SIZE, SIZE), 0, 0);
  const bytes = new Uint8Array(await (await canvas.convertToBlob({ type: 'image/png' })).arrayBuffer());
  let text = '';
  for (const b of bytes) text += String.fromCharCode(b);
  return 'data:image/png;base64,' + btoa(text);
}

const api = new URLSearchParams(location.search).get('api');
window.result = api && (async () => {
  const drawn = api === 'webgpu' ? await webgpu() : api === 'webgl2' ? webgl2() : null;
  if (!drawn) throw new Error(`unknown api ${api}`);
  return { adapter: drawn.adapter, png: await png(drawn.texels) };
})();
</script>
