[package]
name = "wcontainers-mesa-compiler-direct"
description = "Mesa's compiler through our C bridge, every bridge function a safe method of wcontainers-mesa-compiler's trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# The bridge's C (bridge/, ours) and its build (build.rs) are written by hand beside the generated glue: the
# build compiles the bridge and links the pinned Mesa when WCONTAINERS_MESA names its build.
build = "build.rs"

[lib]
path = "implementation.rs"

[features]
default = ["standalone"]
# Links Mesa's compiler libraries itself, with the SPIR-V steps and the GLSL front. Without it only the bridge is
# built, for a program that links Mesa (the OpenGL driver inside Mesa's own library).
standalone = []

[dependencies]
wcontainers-mesa-compiler = { path = "../.." }

[dev-dependencies]
wcontainers-mesa-compiler-conformance = { path = "../../conformance" }

# The conformance suite over the bridge and the pinned Mesa.
[[test]]
name = "conformance"
path = "conformance_run.rs"

[build-dependencies]
cc = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# An outside API's direct crate: it denies unsafe code, so that each use is marked with the fact it rests on.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
