# TODO: remove everything in this file once Rust lets a tool register its own lints on a stable compiler
# (https://github.com/rust-lang/rust/issues/66079). Until then it makes the pinned stable compiler know the tool
# `reviewable` in every crate, so that code can switch a reviewable rule off with the standard
# `#[allow(reviewable::<rule>, reason = "...")]`.
[env]
RUSTC_BOOTSTRAP = "1"

[target.'cfg(all())']
rustflags = ["-Zcrate-attr=feature(register_tool)", "-Zcrate-attr=register_tool(reviewable)"]

[build]
rustdocflags = ["-Zcrate-attr=feature(register_tool)", "-Zcrate-attr=register_tool(reviewable)"]
