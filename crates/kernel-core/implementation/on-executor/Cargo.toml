[package]
name = "wcontainers-kernel-core-on-executor"
version = "0.1.0"
edition = "2024"

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-executor = { path = "../../../executor" }
wcontainers-kernel-core = { path = "../.." }
wcontainers-memory-capability-table = { path = "../../../memory-capability-table" }
wcontainers-memory-capability-table-ordered = { path = "../../../memory-capability-table/implementation/ordered" }
wcontainers-memory-shard = { path = "../../../memory-shard" }
wcontainers-memory-shard-shared-bytes = { path = "../../../memory-shard/implementation/shared-bytes" }
# The cell that hands the executor's interrupter, made when a run starts, to the thread that interrupts it.
spin = { version = "0.10.1", default-features = false, features = ["once"] }
vstd = { version = "=0.0.0-2026-11-22-0344", default-features = false, features = ["alloc"] }

[dev-dependencies]
wcontainers-behavior-source = { path = "../../../behavior-source" }
wcontainers-capability-table = { path = "../../../capability-table" }
wcontainers-processor-architecture = { path = "../../../processor-architecture" }
wcontainers-volatile-bytes = { path = "../../../volatile-bytes" }

[package.metadata.verus]
verify = true

[lints]
workspace = true
