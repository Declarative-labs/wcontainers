[package]
name = "wcontainers-kernel-core-per-task-executor"
version = "0.1.0"
edition = "2024"

[lib]
path = "implementation.rs"

[[test]]
name = "conformance"
path = "conformance_run.rs"

[dependencies]
wcontainers-kernel-core = { path = "../.." }
wcontainers-capability-table = { path = "../../../capability-table" }
wcontainers-memory-shard = { path = "../../../memory-shard" }
wcontainers-volatile-bytes = { path = "../../../volatile-bytes" }
wcontainers-executor = { path = "../../../executor" }
wcontainers-abi.workspace = true
spin = { version = "0.10.1", default-features = false, features = ["mutex", "spin_mutex"] }
vstd = { version = "=0.0.0-2026-11-22-0344", default-features = false, features = ["alloc"] }

[dev-dependencies]
wcontainers-kernel-core-conformance = { path = "../../conformance" }

[package.metadata.verus]
verify = true

[lints]
workspace = true
