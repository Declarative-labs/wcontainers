[package]
name = "wcontainers-opengl-es-webgl"
description = "OpenGL ES over a browser's WebGL 2 context (web-sys), every command a safe method of wcontainers-opengl-es's trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-opengl-es = { path = "../.." }
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = [
    "MessageChannel",
    "MessageEvent",
    "MessagePort",
    "WebGl2RenderingContext",
    "WebGlBuffer",
    "WebGlFramebuffer",
    "WebGlProgram",
    "WebGlQuery",
    "WebGlRenderbuffer",
    "WebGlSampler",
    "WebGlShader",
    "WebGlSync",
    "WebGlTexture",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wcontainers-opengl-es-conformance = { path = "../../conformance" }

# The suite's tests that need no EGL, on a canvas's WebGL 2 context in a browser page (browser/suite.mjs).
[[example]]
name = "browser"
crate-type = ["cdylib"]

[lints]
workspace = true
