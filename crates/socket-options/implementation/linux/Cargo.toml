[package]
name = "wcontainers-socket-options-linux"
description = "The plain socket options and queue counts through Linux's setsockopt, getsockopt and ioctl: the only unsafe code of the socket crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-socket-options = { path = "../.." }
# The kind of socket a descriptor is, checked before every call; the scratch's memfd, its seals, `pread` and `pwrite`.
rustix = { version = "1.1.6", default-features = false, features = ["fs", "net", "std"] }
zerocopy.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# setsockopt, getsockopt and ioctl, and SIOCOUTQNSD, which linux-raw-sys does not carry.
libc = "0.2.191"
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["ioctl", "net", "no_std"] }
# The scratch file's mapping, with unbacked guard pages past its end, through the safe `MmapOptions::map_raw`.
memmap2 = "0.9.12"

[target.'cfg(target_os = "linux")'.dev-dependencies]
wcontainers-socket-options-conformance = { path = "../../conformance" }
# The attacks' setup: descriptors of every kind, the swap of one under a call, the traced thread's id, and flags no
# listed option sets.
rustix = { version = "1.1.6", features = ["event", "fs", "net", "process", "pty", "stdio", "thread", "time"] }
nix = { version = "0.31.3", default-features = false, features = ["fanotify", "net", "signal"] }
socket2 = { version = "0.6.5", features = ["all"] }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[test]]
name = "attacks"
path = "tests/attacks.rs"

[[test]]
name = "containment"
path = "tests/containment.rs"

[lints.rust]
# A primitive: it may use unsafe code only where it carries its own `#[expect(unsafe_code, reason = "..")]`.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
