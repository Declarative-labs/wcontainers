[package]
name = "wcontainers-gpu-webgl"
description = "The WebGL 2 back end of the wcontainers graphics interface, on the OpenGL ES crate's trait; natively on an EGL library's OpenGL ES 3 for tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-gpu = { path = "../.." }
wcontainers-egl = { path = "../../../egl" }
wcontainers-opengl-es = { path = "../../../opengl-es" }
bcdec_rs = "0.2.1"
half = "2.7.1"
naga = { workspace = true, features = ["glsl-out"] }
rangemap = "1.8.0"
# Also turns a format's number back into the format (`Format::deserialize`), as the interface's own tests do.
serde = { version = "1.0.228", features = ["derive"] }

# Natively: the OpenGL ES crate's direct implementation, over the EGL crate's.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wcontainers-egl-direct = { path = "../../../egl/implementation/direct" }
wcontainers-opengl-es-direct = { path = "../../../opengl-es/implementation/direct" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.107", features = ["console"] }

[dev-dependencies]
anyhow = "1.0.100"
# The scenes' plain number arrays as bytes (examples/common/scenes.rs).
bytemuck = "1.25.2"
naga = { workspace = true, features = ["wgsl-in"] }
wcontainers-gpu-conformance = { path = "../../conformance" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wcontainers-graphics-test = { path = "../../../graphics-test" }

# The WebGPU back end on wgpu's Direct3D 12, for drawings compared with it.
[target.'cfg(windows)'.dev-dependencies]
pollster = "1.0.1"
wcontainers-gpu-webgpu = { path = "../webgpu" }
wgpu = { version = "30.0.2", default-features = false, features = ["dx12"] }
# Real Direct3D 11's pictures of the rig's random blocks, compared with these.
image = { version = "0.25.10", default-features = false, features = ["exr", "png"] }
rand = "0.9.2"
rand_chacha = "0.9.0"
# The suite's window, and reading what the compositor shows in it.
wcontainers-test-window = { path = "../../../test-window" }
wcontainers-test-window-win32 = { path = "../../../test-window/implementation/win32" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# The OpenGL ES crate's implementation over a canvas's WebGL 2 context, which the pages' back ends draw on.
wcontainers-opengl-es-webgl = { path = "../../../opengl-es/implementation/webgl" }
js-sys = "0.3.84"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = ["HtmlCanvasElement", "WebGl2RenderingContext", "console"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
# The WebGPU back end on the browser's WebGPU, for the per-draw cost measured against it.
wcontainers-gpu-webgpu = { path = "../webgpu" }
wgpu = { version = "30.0.2", default-features = false, features = ["webgpu"] }

[[example]]
name = "browser"
crate-type = ["cdylib"]

[[example]]
name = "draw-cost"
crate-type = ["cdylib"]

[[test]]
name = "conformance"
path = "conformance_run.rs"

[lints]
workspace = true
