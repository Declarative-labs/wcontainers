[package]
name = "wcontainers-opengl"
description = "OpenGL for wcontainers: a Gallium driver for Mesa's OpenGL state tracker, drawing through wcontainers-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
pollster = "1.0.1"
wcontainers-gpu = { path = "../wcontainers-gpu" }
wcontainers-gpu-webgpu = { path = "../wcontainers-gpu-webgpu" }
wgpu = { version = "30.0.2", default-features = false, features = ["std", "dx12", "vulkan"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[build-dependencies]
cc = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
