[package]
name = "wcontainers-opengl"
description = "OpenGL for wcontainers: a Gallium driver for Mesa's OpenGL state tracker, drawing through wcontainers-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
naga = { workspace = true }
pollster = "1.0.1"
wcontainers-gpu = { path = "../wcontainers-gpu" }
wcontainers-gpu-webgpu = { path = "../wcontainers-gpu-webgpu" }
wcontainers-nir = { path = "../wcontainers-nir", default-features = false }
wcontainers-shaders = { path = "../wcontainers-shaders" }
wgpu = { version = "30.0.2", default-features = false, features = ["std", "dx12", "vulkan"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
bindgen = "0.71.1"
cc = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TODO: remove this crate's 326 uses of unsafe, then replace this table with `[lints]` `workspace = true`.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
