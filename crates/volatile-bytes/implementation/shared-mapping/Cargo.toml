[package]
name = "wcontainers-volatile-bytes-shared-mapping"
description = "Bytes of a mapping that another party may change at any moment, reached only by the C library's memcpy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[dependencies]
thiserror = { version = "2.0.21", default-features = false }
wcontainers-byte-sink = { path = "../../../byte-sink" }
wcontainers-byte-source = { path = "../../../byte-source" }
wcontainers-volatile-bytes = { path = "../.." }
# Maps and unmaps with safe calls; its raw mapping hands out the address and nothing else.
memmap2 = "0.9.12"
# The C library's memcpy, which every copy calls, and the magic number of the huge-page file system.
libc = { version = "0.2.191", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# The memory file's seals, size and file system, all with safe calls.
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
wcontainers-volatile-bytes-conformance = { path = "../../conformance" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1.6", features = ["fs", "param", "process"] }

# A low-level primitive: it denies unsafe code, so that each of its 5 uses is marked (README.md).
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
