[package]
name = "wcontainers-directx"
description = "The Direct3D family as one Windows library (and later one container module): COM shells around our fronts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The library drawing through the WebGL 2 back end on ANGLE in place of WebGPU (plan section 10).
webgl = ["dep:wcontainers-gpu-webgl"]

[dependencies]
wcontainers-direct3d-11 = { path = "../direct3d-11/implementation/translated", package = "wcontainers-direct3d-11-translated" }
wcontainers-directx-graphics-infrastructure = { path = "../directx-graphics-infrastructure/implementation/translated", package = "wcontainers-directx-graphics-infrastructure-translated" }
wcontainers-gpu = { path = "../gpu" }
wcontainers-gpu-webgpu = { path = "../gpu/implementation/webgpu" }
wcontainers-gpu-webgl = { path = "../gpu/implementation/webgl", optional = true }
wcontainers-shaders = { path = "../shaders" }
blake3 = { version = "1", default-features = false }
wgpu = { version = "30.0.2", default-features = false }
pollster = "1.0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Wdk_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D10",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# Exact: src/com/counted.rs builds objects in windows-core's own object layout.
windows-core = "=0.62.2"
parking_lot = "0.12.5"

[target.'cfg(windows)'.dev-dependencies]
# The examples compile their shaders with the system's d3dcompiler_47.dll.
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D_Fxc", "Win32_Storage_Xps", "Win32_System_LibraryLoader"] }
rand = "0.9.2"
rand_chacha = "0.9.0"

[build-dependencies]
cc = "1"

[lints]
workspace = true
