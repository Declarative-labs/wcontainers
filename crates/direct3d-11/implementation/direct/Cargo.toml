[package]
name = "wcontainers-direct3d-11-direct"
description = "The library d3d11.dll, and the debug layer's interfaces its objects answer through its C ABI: both glues, and every unsafe of the API, each marked."
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-direct3d-11 = { path = "../.." }
wcontainers-component-object-model = { path = "../../../component-object-model" }
wcontainers-component-object-model-direct = { path = "../../../component-object-model/implementation/direct" }
wcontainers-direct3d-common = { path = "../../../direct3d-common" }
wcontainers-direct3d-common-direct = { path = "../../../direct3d-common/implementation/direct" }
wcontainers-directx-graphics-infrastructure = { path = "../../../directx-graphics-infrastructure" }
wcontainers-directx-graphics-infrastructure-direct = { path = "../../../directx-graphics-infrastructure/implementation/direct" }
wcontainers-volatile-bytes = { path = "../../../volatile-bytes" }

[features]
# The C tests (tests/c_caller, tests/exact): build.rs compiles their C only with this feature, which the suite's job
# turns on; COM's shadow memory is then exactly the length lent.
c-caller = ["dep:cc", "wcontainers-component-object-model-direct/exact-shadow"]

[build-dependencies]
cc = { version = "1", optional = true }

[[test]]
name = "c_caller"
path = "tests/c_caller/main.rs"
required-features = ["c-caller"]

[[test]]
name = "exact"
path = "tests/exact/main.rs"
required-features = ["c-caller"]

[dev-dependencies]
wcontainers-direct3d-12-direct = { path = "../../../direct3d-12/implementation/direct" }
wcontainers-direct3d-11-hostile = { path = "../hostile" }
wcontainers-direct3d-12-hostile = { path = "../../../direct3d-12/implementation/hostile" }
wcontainers-direct3d-12 = { path = "../../../direct3d-12" }
wcontainers-direct3d-11-recorder = { path = "../recorder" }

# A C boundary: it denies unsafe code, so that each use is marked with its reason.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
type_complexity = "allow"
