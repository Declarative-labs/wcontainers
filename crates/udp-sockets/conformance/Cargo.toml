[package]
name = "wcontainers-udp-sockets-conformance"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "conformance.rs"

[dependencies]
wcontainers-udp-sockets = { path = ".." }
wcontainers-internet-protocol = { path = "../../internet-protocol" }
wcontainers-kernel = { path = "../../kernel" }
etherparse.workspace = true
wcontainers-abi.workspace = true
# The errno values and group addresses of Linux, which the contract's errors and checks use, on every platform.
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["errno", "net", "no_std"] }
