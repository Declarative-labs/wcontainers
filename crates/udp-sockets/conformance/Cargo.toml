[package]
name = "wcontainers-udp-sockets-conformance"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "conformance.rs"

[dependencies]
wcontainers-udp-sockets = { path = ".." }
wcontainers-internet-protocol = { path = "../../internet-protocol" }
wcontainers-kernel = { path = "../../kernel" }
etherparse.workspace = true
wcontainers-abi.workspace = true
wcontainers-configurable-conformance = { path = "../../configurable/conformance" }
wcontainers-negative-route-advice-conformance = { path = "../../negative-route-advice/conformance" }
# The clocks a transmit time is given on, the international atomic one from Linux 4.11.
rustix = { version = "1.1.6", features = ["time", "linux_4_11"] }
# The errno values, group addresses and classic BPF opcodes of Linux, which the contract's errors and checks use.
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["errno", "if_tun", "net", "no_std"] }
