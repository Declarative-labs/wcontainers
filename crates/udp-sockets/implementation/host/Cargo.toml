[package]
name = "wcontainers-udp-sockets-host"
description = "UdpSockets on the UDP and UDP-Lite sockets of the Linux machine it runs on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-configurable = { path = "../../../configurable" }
wcontainers-internet-protocol = { path = "../../../internet-protocol" }
wcontainers-kernel = { path = "../../../kernel" }
wcontainers-negative-route-advisable = { path = "../../../negative-route-advisable" }
wcontainers-readiness = { path = "../../../readiness" }
wcontainers-udp-sockets = { path = "../.." }
wcontainers-internet-protocol-linux-socket-options = { path = "../../../internet-protocol/implementation/linux-socket-options" }
etherparse.workspace = true

[target.'cfg(unix)'.dependencies]
# Opening, binding and connecting sockets, the settings it covers and the socket's addresses.
socket2 = { version = "0.6.5", features = ["all"] }
# Socket types, the connect to no address that socket2 does not make, and the process's user.
rustix = { version = "1.1.6", features = ["net", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The Linux uapi constants and structures of sockets.
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["net", "no_std"] }
# Constants linux-raw-sys lacks.
libc = "0.2.191"

[dev-dependencies]
wcontainers-udp-sockets-conformance = { path = "../../conformance" }
wcontainers-kernel = { path = "../../../kernel" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The network namespace of each test.
nix = { version = "0.31.3", default-features = false, features = ["sched"] }
# The largest buffer size a test asks for.
libc = "0.2.191"
# Counts the allocations of the allocation test (MIT).
stats_alloc = "0.1.10"

[lints]
workspace = true
