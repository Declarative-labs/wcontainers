[package]
name = "wcontainers-gpu-test"
description = "The recording back end and the test suite every wcontainers graphics back end runs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
wcontainers-gpu = { path = "../gpu" }
naga = { workspace = true, features = ["wgsl-in"] }
blake3 = { version = "1", default-features = false }
half = { version = "2", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true
