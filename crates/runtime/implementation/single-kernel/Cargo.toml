[package]
name = "wcontainers-runtime-single-kernel"
description = "Runs a Linux container: drives the wcontainers kernel, an executor that runs the guest's instructions, and the system the embedder supplies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-kernel = { path = "../../../kernel" }
wcontainers-kernel-linux = { path = "../../../kernel/implementation/linux" }
wcontainers-system = { path = "../../../system" }
wcontainers-clock = { path = "../../../clock" }
wcontainers-random-source = { path = "../../../random-source" }
wcontainers-tcp-sockets = { path = "../../../tcp-sockets" }
wcontainers-udp-sockets = { path = "../../../udp-sockets" }
wcontainers-readiness = { path = "../../../readiness" }
wcontainers-internet-protocol = { path = "../../../internet-protocol" }
wcontainers-configurable = { path = "../../../configurable" }
wcontainers-negative-route-advisable = { path = "../../../negative-route-advisable" }
# What to run: the OCI runtime configuration, and the OCI image types it is made from.
oci-spec = { version = "0.10.0", default-features = false, features = ["runtime", "image"], optional = true }
serde_json = { version = "1.0.154", optional = true }
# The properties of a config.json the specification does not define, by path.
serde_ignored = { version = "0.1.14", optional = true }
# An image's layers and a plain tar of files.
tar = { version = "0.4.46", optional = true }
flate2 = { version = "1.1.11", optional = true }
ruzstd = { version = "0.9.1", optional = true }
# Image blobs are checked against their digests.
sha2 = { version = "0.10.9", optional = true }
# The local system's randomness.
getrandom = { version = "0.3.4", optional = true }
# The local system's file backend: Linux's FUSE messages, and the host's file calls.
fuse-abi = { version = "0.2.0", default-features = false, features = ["linux", "zerocopy"], optional = true }
zerocopy = { workspace = true, optional = true }
rustix = { version = "1.1.6", features = ["fs"], optional = true }
libc = { version = "0.2.191", optional = true }
# The local system's resolver's answers as DNS messages.
domain = { version = "0.12.3", default-features = false, features = ["alloc"], optional = true }
# The local system's network: sockets connected without waiting, and the host's readiness of them.
socket2 = { version = "0.6.5", optional = true }
polling = { version = "3.11.0", optional = true }
# The IP and UDP headers of a datagram received, which the kernel takes whole.
etherparse = { workspace = true, optional = true }

[features]
default = ["std"]
# Containers, images and the local system. Without it only the loop is built, for an executor whose loop runs
# where there is no standard library.
std = [
    "dep:oci-spec",
    "dep:serde_json",
    "dep:serde_ignored",
    "dep:tar",
    "dep:flate2",
    "dep:ruzstd",
    "dep:sha2",
    "dep:getrandom",
    "dep:fuse-abi",
    "dep:zerocopy",
    "dep:rustix",
    "dep:libc",
    "dep:socket2",
    "dep:polling",
    "dep:etherparse",
    "dep:domain",
]

[dev-dependencies]
# libzstd, the reference that zstd layers are compared with.
zstd = "0.13.5"

[lints]
workspace = true
