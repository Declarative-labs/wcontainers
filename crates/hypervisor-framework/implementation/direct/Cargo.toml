[package]
name = "wcontainers-hypervisor-framework-direct"
description = "Hypervisor.framework's functions on this Mac, each one marked call through applevisor-sys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[[test]]
name = "conformance"
path = "conformance_run.rs"

[[test]]
name = "volatile_bytes"
path = "volatile_bytes.rs"

[dependencies]
wcontainers-hypervisor-framework = { path = "../.." }
wcontainers-volatile-bytes = { path = "../../../volatile-bytes" }
# The exit records' bytes, whose pointer and length this crate promises.
wcontainers-volatile-bytes-pointer = { path = "../../../volatile-bytes/implementation/pointer" }
# The sink and source the memory's view forwards to its bytes.
wcontainers-byte-sink = { path = "../../../byte-sink" }
wcontainers-byte-source = { path = "../../../byte-source" }
# The memory given to the VM: an anonymous mapping with a safe call; the raw mapping hands out the address and nothing else.
memmap2 = "0.9.12"
# The framework's functions, declared from its headers.
applevisor-sys = "1.0.0"

[build-dependencies]
# The call that sets a vector register, in C.
cc = "1.11.2"

[dev-dependencies]
# The volatile bytes suite, on the memory this crate maps.
wcontainers-volatile-bytes-conformance = { path = "../../../volatile-bytes/conformance" }
wcontainers-hypervisor-framework-conformance = { path = "../../conformance" }

# The bindings of an outside API: it denies unsafe code, so that each of its uses is marked.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
