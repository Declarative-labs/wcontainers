[package]
name = "wcontainers-graphics-test"
description = "Reference pictures from real Direct3D and WARP, other renderers of the same scenes, and picture comparison."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.100"
bytemuck = "1.25.2"
half = "2.7.1"
image = { version = "0.25.10", default-features = false, features = ["exr", "png"] }
pollster = "1.0.1"
rand = "0.9.2"
rand_chacha = "0.9.0"
serde_json = "1.0.154"
wgpu = "30.0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Environment",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
