[package]
name = "wcontainers-gpu-webgl"
description = "The WebGL 2 back end of the wcontainers graphics interface, on glow; natively on ANGLE for tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wcontainers-gpu = { path = "../wcontainers-gpu" }
bcdec_rs = "0.2.1"
glow = "0.18.0"
half = "2.7.1"
naga = { workspace = true, features = ["glsl-out"] }
rangemap = "1.8.0"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"], optional = true }
# Also turns a format's number back into the format (`Format::deserialize`), as the interface's own tests do.
serde = { version = "1.0.228", features = ["derive"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
khronos-egl = { version = "6.0.0", features = ["dynamic"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.84"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = ["WebGl2RenderingContext", "console"] }

[features]
# Call streams of the interface (src/trace.rs): saved with their shaders, and replayed on any back end.
trace = ["dep:postcard", "naga/serialize", "naga/deserialize"]
# `WebGl` records every call into the stream file `WEBGL_TRACE` names, for replaying a real program's
# frames elsewhere.
record = ["trace"]


[dev-dependencies]
anyhow = "1.0.100"
naga = { workspace = true, features = ["wgsl-in"] }
wcontainers-gpu-test = { path = "../wcontainers-gpu-test" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wcontainers-graphics-test = { path = "../wcontainers-graphics-test" }

# The WebGPU back end on wgpu's Direct3D 12, for drawings compared with it.
[target.'cfg(windows)'.dev-dependencies]
pollster = "1.0.1"
wcontainers-gpu-webgpu = { path = "../wcontainers-gpu-webgpu" }
wgpu = { version = "30.0.2", default-features = false, features = ["dx12"] }
# Real Direct3D 11's pictures of the rig's random blocks, compared with these.
image = { version = "0.25.10", default-features = false, features = ["exr", "png"] }
rand = "0.9.2"
rand_chacha = "0.9.0"
# The suite's window, and reading what the compositor shows in it.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
web-sys = { version = "0.3.107", features = ["HtmlCanvasElement", "console"] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
# The WebGPU back end on the browser's WebGPU, for the per-draw cost measured against it.
wcontainers-gpu-webgpu = { path = "../wcontainers-gpu-webgpu" }
wgpu = { version = "30.0.2", default-features = false, features = ["webgpu"] }

[[example]]
name = "browser"
crate-type = ["cdylib"]

[[example]]
name = "draw-cost"
crate-type = ["cdylib"]

[[example]]
name = "replay"
crate-type = ["cdylib"]
required-features = ["trace"]

# TODO: remove this crate's 163 uses of unsafe, then replace this table with `[lints]` `workspace = true`.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
