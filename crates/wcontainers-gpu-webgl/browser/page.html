<!doctype html>
<meta charset="utf-8">
<title>WebGL 2 back end</title>
<script type="importmap">{ "imports": { "wcontainers-device": "./device.js" } }</script>
<script type="module">
// Draws the scenes of examples/common/scenes.rs through the WebGL 2 back end built for WebAssembly
// (pkg/browser.js, from wasm-bindgen). window.run(scene, change) resolves to the texels as base64;
// window.report() to the renderer, extensions and capability list; window.pictures() lists
// [scene, change] pairs. ?off= lists extensions to treat as
// missing, separated by spaces.
import init, { Device } from './pkg/browser.js';
await init();
const canvas = document.createElement('canvas');
const gl = canvas.getContext('webgl2', { antialias: false, depth: false, stencil: false, alpha: true });
if (!gl) throw new Error('no WebGL 2 context');
canvas.addEventListener('webglcontextlost', (e) => console.log(`context lost: ${e.statusMessage}`));
console.log(`context lost before the back end: ${gl.isContextLost()}`);
const device = new Device(gl, new URLSearchParams(location.search).get('off') ?? '');
const base64 = (bytes) => {
  let s = '';
  for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(s);
};
await new Promise((resolve) => setTimeout(resolve, 200));
console.log(`context lost 200 ms after the back end was made: ${gl.isContextLost()}`);
window.run = async (scene, change) => {
  const texels = base64(device.draw(scene, change));
  await new Promise((resolve) => setTimeout(resolve, 50));
  if (gl.isContextLost()) throw new Error(`the context was lost while drawing ${scene}`);
  return texels;
};
window.report = () => device.report();
window.pictures = () => Device.pictures().trim().split('\n').map((l) => l.split(' '));
window.ready = true;
</script>
