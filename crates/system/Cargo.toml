[package]
name = "wcontainers-system"
version = "0.1.0"
edition = "2024"

[lib]
path = "interface.rs"

[dependencies]
domain = { version = "0.12.3", default-features = false }
wcontainers-abi.workspace = true
wcontainers-readiness = { path = "../readiness" }
wcontainers-kernel = { path = "../kernel" }
wcontainers-clock = { path = "../clock" }
wcontainers-executor = { path = "../executor" }
wcontainers-random-source = { path = "../random-source" }
wcontainers-tcp-sockets = { path = "../tcp-sockets" }
wcontainers-udp-sockets = { path = "../udp-sockets" }
wcontainers-icmp-sockets = { path = "../icmp-sockets" }
wcontainers-raw-sockets = { path = "../raw-sockets" }
wcontainers-route-resolver = { path = "../route-resolver" }
wcontainers-volatile-bytes = { path = "../volatile-bytes" }
