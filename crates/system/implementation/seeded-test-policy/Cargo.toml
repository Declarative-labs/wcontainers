[package]
name = "wcontainers-system-seeded-test-policy"
description = "The kernel test crate's policy: the seeded choices of a test run, built wherever the runtime's loop runs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-kernel-linux = { path = "../../../kernel/implementation/linux" }
wcontainers-system = { path = "../.." }
wcontainers-clock = { path = "../../../clock" }
wcontainers-random-source = { path = "../../../random-source" }
wcontainers-kernel = { path = "../../../kernel" }
wcontainers-tcp-sockets = { path = "../../../tcp-sockets" }
wcontainers-udp-sockets = { path = "../../../udp-sockets" }
wcontainers-readiness = { path = "../../../readiness" }
wcontainers-internet-protocol = { path = "../../../internet-protocol" }
wcontainers-configurable = { path = "../../../configurable" }
wcontainers-negative-route-advisable = { path = "../../../negative-route-advisable" }
# The type of the resolver's answers it refuses to give.
domain = { version = "0.12.3", default-features = false }
wcontainers-runtime-single-kernel = { path = "../../../runtime/implementation/single-kernel", default-features = false }
# The schedule's draws, the same generator the test crate uses.
rand = { version = "0.9.2", default-features = false, features = ["std_rng"] }
# The policy's state, changed through the shared reference the kernel holds.
spin = { version = "0.10.0", default-features = false, features = ["spin_mutex", "lock_api"] }

[lints]
workspace = true
