[package]
name = "wcontainers-system-seeded-test-policy"
description = "The kernel test crate's policy: the seeded choices of a test run, built wherever the runtime's loop runs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-kernel-linux = { path = "../../../kernel/implementation/linux" }
wcontainers-system = { path = "../.." }
wcontainers-runtime-single-kernel = { path = "../../../runtime/implementation/single-kernel", default-features = false }
# The schedule's draws, the same generator the test crate uses.
rand = { version = "0.9.2", default-features = false, features = ["std_rng"] }
# The policy's state, changed through the shared reference the kernel holds.
spin = { version = "0.10.0", default-features = false, features = ["spin_mutex", "lock_api"] }

[lints]
workspace = true
