[package]
name = "wcontainers-directx"
description = "The Direct3D family as one Windows library (and later one container module): COM shells around our fronts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wcontainers-direct3d-11 = { path = "../wcontainers-direct3d-11" }
wcontainers-gpu = { path = "../wcontainers-gpu" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
windows-core = "0.62.2"

[lints]
workspace = true
