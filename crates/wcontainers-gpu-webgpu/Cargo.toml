[package]
name = "wcontainers-gpu-webgpu"
description = "The WebGPU back end of the wcontainers graphics interface, on wgpu: native for tests, the browser's WebGPU when built for WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wcontainers-gpu = { path = "../wcontainers-gpu" }
bcdec_rs = "0.2.1"
half = { version = "2.7.1", default-features = false }
naga.workspace = true
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = "1.0.154"
wgpu-naga-bridge = "30.0.2"
wgpu = { version = "30.0.2", default-features = false, features = ["std", "dx12", "metal", "vulkan", "webgpu", "naga-ir", "wgsl"] }

# Waiting in the browser suspends through JSPI.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.107"
wasm-bindgen = "=0.2.130"

[dev-dependencies]
anyhow = "1.0.100"
bytemuck = "1.25.2"
fastrand = "2.5.0"
naga = { workspace = true, features = ["wgsl-in"] }
pdb = "0.8.0"
png = "0.18.1"
wcontainers-gpu-test = { path = "../wcontainers-gpu-test" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
libtest-mimic = "0.8.1"
pollster = "1.0.1"

# The suite's present test on macOS: a window on the main thread, read through ScreenCaptureKit.
[target.'cfg(target_os = "macos")'.dev-dependencies]
block2 = "0.6.2"
objc2 = "0.6.3"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-screen-capture-kit = "0.3.2"

# Real Direct3D 11 on the same GPU and WARP, through the rig's device and comparison (tests/direct3d.rs).
[target.'cfg(windows)'.dev-dependencies]
wcontainers-graphics-test = { path = "../wcontainers-graphics-test" }
image = { version = "0.25.10", default-features = false }
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

# proptest, which the shared suite brings, takes getrandom's browser source to build for WebAssembly.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
web-sys = { version = "0.3.107", features = ["HtmlCanvasElement"] }

[lints]
workspace = true

# Runs on the main thread, which macOS windows need.
[[test]]
name = "present"
harness = false

# Reports a test the device cannot run as ignored.
[[test]]
name = "depth"
harness = false

# Reports a known failure on one of wgpu's APIs as ignored, with its reason.
[[test]]
name = "raster"
harness = false
