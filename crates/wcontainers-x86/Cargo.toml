[package]
name = "wcontainers-x86"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wcontainers-guest-cpu = { path = "../wcontainers-guest-cpu", default-features = false }
wcontainers-abi.workspace = true
zerocopy.workspace = true
iced-x86 = { version = "1.22.0", default-features = false, features = ["no_std", "decoder"], optional = true }
wasm-encoder = { version = "0.263.0", optional = true }

[build-dependencies]
# Each `Code`'s claim group comes from iced's own tables, read at build time.
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "instr_info"] }

[dev-dependencies]
raw-cpuid = "11.6.0"
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "instr_info"] }

[features]
default = ["translate"]
# The translation half: the decoder and the meanings. The kernel depends on the core alone, with this off.
translate = ["dep:iced-x86", "dep:wasm-encoder", "wcontainers-guest-cpu/translate"]

[lints]
workspace = true
