[package]
name = "wcontainers-shared-memory-host"
description = "Words in memory the host maps: anonymous memory, and a memory file sealed against shrinking."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-shared-memory = { path = "../.." }
thiserror = "2.0.21"

[target.'cfg(unix)'.dependencies]
# Maps and unmaps with safe calls; its raw mapping hands out the address and nothing else.
memmap2 = "0.9.12"

[target.'cfg(target_os = "linux")'.dependencies]
# The file's seals, size and file system, all with safe calls.
rustix = { version = "1.1.6", features = ["fs"] }
# The magic number of the huge-page file system, whose memory files can fault for want of pages.
libc = "0.2.191"

[dev-dependencies]
wcontainers-shared-memory-conformance = { path = "../../conformance" }
wcontainers-volatile-bytes-conformance = { path = "../../../volatile-bytes/conformance" }

[[test]]
name = "conformance"
path = "conformance.rs"

# A low-level primitive: its 1 use of unsafe (the `unsafe impl Mapped`) is marked.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
