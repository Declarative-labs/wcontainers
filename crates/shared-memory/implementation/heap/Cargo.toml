[package]
name = "wcontainers-shared-memory-heap"
description = "Words on this program's heap, for the checks that cannot run a host's mapping: Miri and Kani."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-shared-memory = { path = "../.." }
# For the Kani checks in proofs.rs only: the trait a part implements.
wcontainers-volatile-bytes = { path = "../../../volatile-bytes" }

[target.'cfg(target_os = "linux")'.dependencies]
# For the Kani checks in proofs.rs only: the futex calls they replace.
rustix = { version = "1.1.6", default-features = false, features = ["thread"] }

[dev-dependencies]
wcontainers-shared-memory-conformance = { path = "../../conformance" }
wcontainers-volatile-bytes-conformance = { path = "../../../volatile-bytes/conformance" }

[[test]]
name = "conformance"
path = "conformance.rs"

# A low-level primitive: its 1 use of unsafe (the `unsafe impl Mapped`) is marked.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
