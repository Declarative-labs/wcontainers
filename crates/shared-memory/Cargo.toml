[package]
name = "wcontainers-shared-memory"
description = "Memory that something outside this program may change at any moment, reached only by aligned 8-byte atomic accesses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "interface.rs"

[dependencies]
thiserror = { version = "2.0.21", default-features = false }
wcontainers-byte-sink = { path = "../byte-sink" }
wcontainers-byte-source = { path = "../byte-source" }
wcontainers-volatile-bytes = { path = "../volatile-bytes" }

[target.'cfg(target_os = "linux")'.dependencies]
# The futex wait and wake, which take the word's low half as an `&AtomicU32`.
rustix = { version = "1.1.6", default-features = false, features = ["thread"] }

# A low-level primitive: its 3 uses of unsafe (the unsafe trait `Mapped` and the two `from_ptr` calls) are each marked.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
