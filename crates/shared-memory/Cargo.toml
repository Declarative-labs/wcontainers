[package]
name = "wcontainers-shared-memory"
description = "Memory that another party may read and write at any moment, reached only by copies and single aligned words, outside every Rust allocation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "interface.rs"

[features]
# The host's mappings, which need the standard library: anonymous memory, and a memory file sealed against shrinking.
host = ["dep:memmap2", "rustix/fs", "rustix/std"]

[dependencies]
thiserror = { version = "2.0.21", default-features = false }
wcontainers-byte-sink = { path = "../byte-sink" }
wcontainers-byte-source = { path = "../byte-source" }
wcontainers-volatile-bytes = { path = "../volatile-bytes" }

[target.'cfg(unix)'.dependencies]
# Maps and unmaps with safe calls; its raw mapping hands out the address and nothing else.
memmap2 = { version = "0.9.12", optional = true }
# The C library's memcpy, which every copy calls; on Linux also the futex call, which rustix takes only on a reference,
# and the magic number of the huge-page file system, whose memory files can fault for want of pages.
libc = { version = "0.2.191", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# The error numbers of the futex call; and the host file's seals, size and file system, all with safe calls.
rustix = { version = "1.1.6", default-features = false }

[dev-dependencies]
wcontainers-shared-memory-conformance = { path = "conformance" }
wcontainers-volatile-bytes-conformance = { path = "../volatile-bytes/conformance" }
wcontainers-volatile-bytes = { path = "../volatile-bytes" }
wcontainers-byte-source = { path = "../byte-source" }

[target.'cfg(unix)'.dev-dependencies]
# The page size, at whose boundaries the tests copy.
rustix = { version = "1.1.6", features = ["param"] }
# The neighbors the guard test maps around a memory and then unmaps.
memmap2 = "0.9.12"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Memory files, their seals and second descriptors, which the host's tests change under a mapping.
rustix = { version = "1.1.6", features = ["fs", "param"] }

[[test]]
name = "host"
path = "foreign_implementation/host/conformance.rs"
required-features = ["host"]

[[test]]
name = "guard"
path = "foreign_implementation/host/guard.rs"
required-features = ["host"]

[[test]]
name = "process"
path = "foreign_implementation/host/process.rs"
required-features = ["host"]

[[test]]
name = "heap"
path = "foreign_implementation/heap/conformance.rs"

[[test]]
name = "attacks"
path = "attack/attacks.rs"

[[test]]
name = "refused"
path = "attack/refused.rs"
required-features = ["host"]

# A low-level primitive: each use of unsafe is marked. In a host build on Linux, 10: `Region::new`'s promise; the region's
# copy out, copy in, load, store, swap, compare-and-exchange and futex call; the one foreign call to memcpy; and the
# host's mapping. Built only under Miri and Kani: the heap's mapping, and Kani's stand-in for the foreign call.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(refused, values(any()))"] }
