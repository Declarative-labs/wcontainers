[package]
name = "wcontainers-behavior-source-recording"
description = "What one ARM64 chip did with each instruction on each state it was given, played back as the chip."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[[test]]
name = "conformance"
path = "conformance_run.rs"

[[example]]
name = "record"
path = "record.rs"

[dependencies]
wcontainers-behavior-source = { path = "../.." }
wcontainers-distinguishing-state-generator = { path = "../../../distinguishing-state-generator" }
wcontainers-processor-architecture = { path = "../../../processor-architecture" }
wcontainers-processor-architecture-arm64 = { path = "../../../processor-architecture/implementation/arm64" }

[dev-dependencies]
wcontainers-behavior-source-conformance = { path = "../../conformance" }
wcontainers-distinguishing-state-generator-arm64 = { path = "../../../distinguishing-state-generator/implementation/arm64" }
wcontainers-instruction-input-domain-arm64 = { path = "../../../instruction-input-domain/implementation/arm64" }

# The chip the record tool runs.
[target.'cfg(all(target_arch = "aarch64", target_os = "linux"))'.dev-dependencies]
wcontainers-behavior-source-kvm-single-step = { path = "../kvm-single-step" }

[lints]
workspace = true
