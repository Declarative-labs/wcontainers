[package]
name = "wcontainers-behavior-source-kvm-single-step"
description = "A behavior source that really runs one ARM64 instruction at EL0 of a KVM virtual machine, one state at a time."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lib]
path = "implementation.rs"

[[test]]
name = "conformance"
path = "conformance_run.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-behavior-source = { path = "../.." }
wcontainers-processor-architecture = { path = "../../../processor-architecture" }
wcontainers-processor-architecture-arm64 = { path = "../../../processor-architecture/implementation/arm64" }
wcontainers-volatile-bytes = { path = "../../../volatile-bytes" }
# The slot and its registers as the bytes guest memory holds.
zerocopy.workspace = true
# System register fields and exception syndrome fields.
aarch64-cpu = "12.0.0"
# Page table entry bits.
aarch64-paging = { version = "0.12.3", default-features = false }
# SCTLR_EL1's bits.
arm-sysregs = { version = "0.5.2", features = ["el1"] }

[target.'cfg(all(target_arch = "aarch64", target_os = "linux"))'.dependencies]
# KVM's calls and structures, and the one call kvm-ioctls leaves unsafe, made safe.
kvm-ioctls = "0.25.1"
kvm-bindings = "0.14.2"
wcontainers-kvm = { path = "../../../kvm" }
wcontainers-kvm-direct = { path = "../../../kvm/implementation/direct" }

[build-dependencies]
# The layout of the slot, which the handler is assembled with.
wcontainers-abi.workspace = true
wcontainers-processor-architecture-arm64 = { path = "../../../processor-architecture/implementation/arm64" }
zerocopy.workspace = true
# Assembles the handler.
cc = "1.11.2"
# Reads the handler's bytes and labels out of the assembled object.
object = { version = "0.37.3", default-features = false, features = ["read_core", "elf"] }

[dev-dependencies]
wcontainers-behavior-source-conformance = { path = "../../conformance" }
wcontainers-distinguishing-state-generator-input-domain = { path = "../../../distinguishing-state-generator/implementation/input-domain" }
wcontainers-instruction-input-domain-arm64 = { path = "../../../instruction-input-domain/implementation/arm64" }

[lints]
workspace = true
