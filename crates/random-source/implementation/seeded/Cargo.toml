[package]
name = "wcontainers-random-source-seeded"
description = "Random bytes from a seed, the same bytes for the same seed; not fit for cryptography."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[[test]]
name = "conformance"
path = "conformance.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-random-source = { path = "../.." }
rand = { version = "0.9.5", default-features = false }
rand_chacha = { version = "0.9.0", default-features = false }

[dev-dependencies]
wcontainers-random-source-conformance = { path = "../../conformance" }

[lints]
workspace = true
