[package]
name = "wcontainers-test-window-win32"
version = "0.1.0"
edition = "2024"

[lib]
path = "implementation.rs"

[[test]]
name = "conformance"
path = "conformance_run.rs"

[dependencies]
raw-window-handle = "0.6.2"
wcontainers-test-window = { path = "../.." }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
wcontainers-test-window-conformance = { path = "../../conformance" }

# A bindings crate: it denies unsafe code, so that each use is marked with its reason.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
