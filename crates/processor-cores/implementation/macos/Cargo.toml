[package]
name = "wcontainers-processor-cores-macos"
description = "The cores of a Mac by performance level, on Apple silicon steered only through the calling thread's quality-of-service class."
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "implementation.rs"

[[test]]
name = "conformance"
path = "conformance_run.rs"

[dependencies]
wcontainers-processor-cores = { path = "../.." }

[target.'cfg(target_os = "macos")'.dependencies]
# sysctlbyname as a safe call, for the performance levels and the microcode revision (MIT).
sysctl = "0.7.1"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
# The quality-of-service class of the calling thread, set safely (MIT OR Apache-2.0); it refuses to build for Intel Macs, and rtkit, Linux's D-Bus client, stays off.
gdt-cpus = { version = "0.2606.1", default-features = false }
wcontainers-processor-architecture-arm64 = { path = "../../../processor-architecture/implementation/arm64" }

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
wcontainers-processor-architecture-x86-64 = { path = "../../../processor-architecture/implementation/x86-64" }

[dev-dependencies]
wcontainers-processor-cores-conformance = { path = "../../conformance" }

[lints]
workspace = true
