[package]
name = "wcontainers-internet-protocol-linux-socket-options"
description = "The shared settings of crates/internet-protocol as Linux socket options, for the host implementations of the socket interfaces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-internet-protocol = { path = "../.." }
wcontainers-kernel = { path = "../../../kernel" }
wcontainers-readiness = { path = "../../../readiness" }
etherparse.workspace = true

[target.'cfg(unix)'.dependencies]
# Socket calls, the socket options it wraps, poll, and the host's error numbers.
rustix = { version = "1.1.6", features = ["event", "net"] }
# Creating, binding and connecting sockets, sendmsg, and the socket options it covers.
socket2 = { version = "0.6.5", features = ["all"] }
# The host's readiness of sockets (epoll on Linux, kqueue on the BSDs), registering a socket of any kind by its descriptor.
mio = { version = "1.2.5", default-features = false, features = ["os-ext"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The Linux uapi constants and structures that rustix does not wrap.
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["general", "net", "no_std"] }
# Linux's constants and C structures of the control messages of sendmsg and of a few options.
libc = "0.2.191"
# Linux's socket option calls for the options no vetted crate wraps.
wcontainers-linux-socket-options = { path = "../../../linux-socket-options" }
wcontainers-linux-socket-options-direct = { path = "../../../linux-socket-options/implementation/direct" }
# The filesystem user a socket is opened as, the host's interfaces, recvmsg with its control messages as bytes, and
# the socket options it wraps.
nix = { version = "0.31.3", default-features = false, features = ["fs", "net", "socket", "time", "uio", "user"] }
# The uapi structures read from and written as bytes.
zerocopy.workspace = true

[lints]
workspace = true
