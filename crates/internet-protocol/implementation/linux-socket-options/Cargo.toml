[package]
name = "wcontainers-internet-protocol-linux-socket-options"
description = "The shared settings of crates/internet-protocol as Linux socket options, for the host implementations of the socket interfaces."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-internet-protocol = { path = "../.." }
wcontainers-kernel = { path = "../../../kernel" }
wcontainers-readiness = { path = "../../../readiness" }
etherparse.workspace = true

[target.'cfg(unix)'.dependencies]
# Socket calls, the socket options it wraps, poll, and the host's error numbers.
rustix = { version = "1.1.6", features = ["event", "net"] }
# Creating, binding and connecting sockets, sendmsg, and the socket options it covers.
socket2 = { version = "0.6.5", features = ["all"] }
# The host's readiness of sockets (epoll on Linux, kqueue on the BSDs), which registers a socket of any kind on every system.
polling = "3.11.0"

[target.'cfg(target_os = "linux")'.dependencies]
# The Linux uapi constants and structures that rustix does not wrap.
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["general", "net", "no_std"] }
# setsockopt and getsockopt for the options rustix does not wrap, and the control messages of sendmsg and recvmsg.
libc = "0.2.191"

[lints]
workspace = true
