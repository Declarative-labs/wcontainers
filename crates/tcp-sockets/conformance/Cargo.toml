[package]
name = "wcontainers-tcp-sockets-conformance"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "suite.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-configurable = { path = "../../configurable" }
wcontainers-configurable-conformance = { path = "../../configurable/conformance" }
wcontainers-tcp-sockets = { path = ".." }
wcontainers-internet-protocol = { path = "../../internet-protocol" }
wcontainers-kernel = { path = "../../kernel" }
wcontainers-negative-route-advisable = { path = "../../negative-route-advisable" }
wcontainers-negative-route-advisable-conformance = { path = "../../negative-route-advisable/conformance" }
wcontainers-readiness = { path = "../../readiness" }
wcontainers-readiness-conformance = { path = "../../readiness/conformance" }
wcontainers-volatile-bytes = { path = "../../volatile-bytes" }
wcontainers-byte-sink = { path = "../../byte-sink" }
wcontainers-byte-source = { path = "../../byte-source" }
# Reads the SYN headers an accept gives.
etherparse = { workspace = true, features = ["std"] }
# The raw sockets the ICMP checks capture SYNs and send errors with, as the network between the two ends.
rustix = { version = "1.1.6", features = ["net"] }

# Linux's codes of classic BPF and IPv4 options, which the checks write into what they send, and the local routing
# table and route feature numbers each check's namespace is set up with.
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["net", "if_tun", "netlink", "no_std"] }
# The host's interfaces, to find the loopback one by its flag, and the network namespace of a check of its own.
nix = { version = "0.31.3", default-features = false, features = ["net", "sched"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Brings a check's own loopback up through the kernel's routing socket.
netlink-packet-core = "0.9.0"
netlink-packet-route = "0.34.0"
netlink-sys = { version = "0.9.0", default-features = false }

[lints]
workspace = true
