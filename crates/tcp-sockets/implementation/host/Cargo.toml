[package]
name = "wcontainers-tcp-sockets-host"
description = "TCP and MPTCP connections and listeners made of the Linux sockets of the machine it runs on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-configurable = { path = "../../../configurable" }
wcontainers-internet-protocol = { path = "../../../internet-protocol" }
wcontainers-kernel = { path = "../../../kernel" }
wcontainers-negative-route-advisable = { path = "../../../negative-route-advisable" }
wcontainers-readiness = { path = "../../../readiness" }
wcontainers-tcp-sockets = { path = "../.." }
etherparse.workspace = true
wcontainers-internet-protocol-linux-socket-options = { path = "../../../internet-protocol/implementation/linux-socket-options" }

[target.'cfg(unix)'.dependencies]
# The basic socket calls and the settings it covers, on the socket's descriptor.
socket2 = { version = "0.6.5", features = ["all"] }
rustix = { version = "1.1.6", features = ["net", "process", "system"] }
# The host's interface addresses, for the interface a SYN came in on.
nix = { version = "0.31.3", default-features = false, features = ["net"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["ioctl", "net", "netlink", "no_std"] }
libc = "0.2.191"
# The attributes of a transmit report's statistics.
netlink-packet-core = "0.9.0"

[dev-dependencies]
wcontainers-tcp-sockets-conformance = { path = "../../conformance" }

[[test]]
name = "conformance"
path = "conformance.rs"

# TODO: remove this crate's 23 uses of unsafe, then replace this table with `[lints]` `workspace = true`.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
