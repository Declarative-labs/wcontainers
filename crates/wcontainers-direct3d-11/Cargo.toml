[package]
name = "wcontainers-direct3d-11"
description = "Our Direct3D 11 front (also serving Direct3D 10), drawing through the wcontainers-gpu interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# The host's clock unit, which timestamps count in.
wcontainers-abi.workspace = true
wcontainers-gpu = { path = "../wcontainers-gpu" }
wcontainers-shaders = { path = "../wcontainers-shaders" }
wcontainers-directx-graphics-infrastructure = { path = "../wcontainers-directx-graphics-infrastructure" }
blake3 = { version = "1", default-features = false }
naga = { workspace = true }
serde = { version = "1", features = ["derive"] }

# Not under the workspace's ban on unsafe code: it implements Windows COM interfaces, which are raw pointers.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
