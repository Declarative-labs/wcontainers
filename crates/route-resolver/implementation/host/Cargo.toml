[package]
name = "wcontainers-route-resolver-host"
description = "A route resolver that asks the Linux routing socket of the calling thread's network namespace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-internet-protocol = { path = "../../../internet-protocol" }
wcontainers-kernel = { path = "../../../kernel" }
wcontainers-route-resolver = { path = "../.." }
wcontainers-internet-protocol-linux-socket-options = { path = "../../../internet-protocol/implementation/linux-socket-options" }

[target.'cfg(target_os = "linux")'.dependencies]
etherparse.workspace = true
libc = "0.2.191"
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["net", "netlink", "no_std"] }
socket2 = { version = "0.6.5", features = ["all"] }
rustix = { version = "1.1.6", features = ["net"] }
netlink-packet-core = "0.9.0"
netlink-packet-route = "0.34.0"
netlink-sys = { version = "0.9.0", default-features = false }

[[test]]
name = "conformance"
path = "conformance.rs"

[dev-dependencies]
wcontainers-route-resolver-conformance = { path = "../../conformance" }

[lints]
workspace = true
