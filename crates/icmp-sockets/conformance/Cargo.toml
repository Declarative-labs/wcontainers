[package]
name = "wcontainers-icmp-sockets-conformance"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "conformance.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-configurable = { path = "../../configurable" }
wcontainers-configurable-conformance = { path = "../../configurable/conformance" }
wcontainers-icmp-sockets = { path = ".." }
wcontainers-internet-protocol = { path = "../../internet-protocol" }
wcontainers-kernel = { path = "../../kernel" }
# The network namespace tools of the route resolver suite: iproute2, link and neighbour statistics.
wcontainers-route-resolver-conformance = { path = "../../route-resolver/conformance" }
etherparse.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The packet socket that sees what leaves a link, and the errno values of Linux.
libc = "0.2.191"
# The type number of a segment routing header.
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["net", "no_std"] }
# The network namespace of each check.
rustix = { version = "1.1.6", features = ["net", "thread", "time"] }
