[package]
name = "wcontainers-icmp-sockets-conformance"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "suite.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-configurable = { path = "../../configurable" }
wcontainers-configurable-conformance = { path = "../../configurable/conformance" }
wcontainers-icmp-sockets = { path = ".." }
wcontainers-internet-protocol = { path = "../../internet-protocol" }
wcontainers-kernel = { path = "../../kernel" }
wcontainers-readiness = { path = "../../readiness" }
wcontainers-readiness-conformance = { path = "../../readiness/conformance" }
wcontainers-byte-sink = { path = "../../byte-sink" }
wcontainers-byte-source = { path = "../../byte-source" }
wcontainers-volatile-bytes = { path = "../../volatile-bytes" }
etherparse.workspace = true
mitsein.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Linux's socket option calls for the source preferences, which no vetted crate wraps.
wcontainers-linux-socket-options = { path = "../../linux-socket-options" }
# The packet types of a packet socket and the errno values of Linux.
libc = "0.2.191"
# The type number of a segment routing header, and the route metrics' numbers.
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["net", "netlink", "no_std"] }
# The clocks of transmit times.
rustix = { version = "1.1.6", features = ["net", "time", "linux_4_11"] }
# The network namespace of each check and the packet socket that sees what leaves a link.
nix = { version = "0.31.3", default-features = false, features = ["net", "sched", "socket"] }
# The links and addresses of each check's network, made through the kernel's routing socket (MIT).
netlink-packet-core = "0.9.0"
netlink-packet-route = "0.34.0"
netlink-sys = { version = "0.9.0", default-features = false }

[lints]
workspace = true
