[package]
name = "wcontainers-linux-socket-options"
description = "Linux's socket option and socket ioctl calls that no vetted crate wraps safely, one typed method each."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "interface.rs"

[dependencies]
wcontainers-abi.workspace = true
# The uapi structures and constants the options take.
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["net", "no_std"] }
# The classic BPF instruction a program option takes.
libc = "0.2.191"
# The socket storage bytes a source filter holds.
zerocopy.workspace = true

[lints]
workspace = true
