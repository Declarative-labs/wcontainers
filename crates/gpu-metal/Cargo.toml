[package]
name = "wcontainers-gpu-metal"
description = "The wcontainers graphics interface drawn with Metal, through the safe Metal trait of wcontainers-metal."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wcontainers-gpu = { path = "../gpu" }
wcontainers-metal = { path = "../metal" }
naga.workspace = true
raw-window-handle = "0.6.2"

[dev-dependencies]
naga = { workspace = true, features = ["wgsl-in"] }
wcontainers-gpu-test = { path = "../gpu-test" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
libtest-mimic = "0.8.1"
wcontainers-metal-direct = { path = "../metal/implementation/direct" }
# The suite's window, and reading what it shows: made on the main thread (tests/present.rs).
wcontainers-test-window = { path = "../test-window" }
wcontainers-test-window-appkit = { path = "../test-window/implementation/appkit" }

[[test]]
name = "present"
harness = false

# The fuzzer runs each batch in a process of its own, as the main thread, where its window is made.
[[test]]
name = "fuzz"
harness = false

# The workspace's lints, which a crate with a table of its own cannot inherit, and checked arithmetic: every size,
# count, offset and length a caller gives passes through here to the Metal trait, so no operation on one may wrap.
[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
arithmetic_side_effects = "deny"
