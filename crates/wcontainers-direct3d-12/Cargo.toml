[package]
name = "wcontainers-direct3d-12"
description = "The wcontainers Direct3D 12 front, written from Microsoft's documentation, on the wcontainers graphics interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wcontainers-gpu = { path = "../wcontainers-gpu" }
wcontainers-directx-graphics-infrastructure = { path = "../wcontainers-directx-graphics-infrastructure" }
wcontainers-shaders = { path = "../wcontainers-shaders" }
slab = "0.4"
md-5 = { version = "0.11", default-features = false }
half = { version = "2.7.1", default-features = false }
naga = { workspace = true }

[dev-dependencies]
wcontainers-gpu-webgpu = { path = "../wcontainers-gpu-webgpu" }
wgpu = { version = "30.0.2", default-features = false, features = ["std", "dx12", "metal", "vulkan", "webgpu", "naga-ir"] }
pollster = "1.0.1"
png = "0.18.1"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

# The Windows library and its two forwarders (examples/directx/main.rs says why they are examples).
[[example]]
name = "wcontainers_d3d12"
path = "examples/directx/main.rs"
crate-type = ["cdylib"]

[[example]]
name = "d3d12"
crate-type = ["cdylib"]

[[example]]
name = "dxgi"
crate-type = ["cdylib"]

[lints]
workspace = true
