[package]
name = "wcontainers-nir"
description = "NIR, the shader form Mesa's drivers receive, into the common form of wcontainers-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["standalone"]
# Links Mesa's compiler libraries itself, with the SPIR-V steps and the GLSL front, for the corpus
# and the tests. Without it only the bridge is built, for a program that links Mesa (the OpenGL
# driver inside Mesa's own library).
standalone = []

[dependencies]
blake3 = { version = "1", default-features = false }
naga = { workspace = true, features = ["spv-in"] }
spirv = "0.4"
wcontainers-gpu = { path = "../gpu" }
wcontainers-shaders = { path = "../shaders" }

[dev-dependencies]
ash = { version = "0.38", default-features = false, features = ["std", "debug"] }
glam = "0.30"
glow = "0.18.0"
khronos-egl = { version = "6.0.0", features = ["dynamic"] }
libloading = "0.8"
wcontainers-gpu = { path = "../gpu" }
naga = { workspace = true, features = ["spv-in", "spv-out", "wgsl-in"] }
rand = "0.9.2"
rand_chacha = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "corpus"
path = "tests/corpus/main.rs"
harness = false
required-features = ["standalone"]

[build-dependencies]
blake3 = { version = "1", default-features = false }
cc = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
