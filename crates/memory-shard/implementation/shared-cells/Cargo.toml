[package]
name = "wcontainers-memory-shard-shared-cells"
version = "0.1.0"
edition = "2024"

[lib]
path = "implementation.rs"

[[test]]
name = "conformance"
path = "conformance_run.rs"

[dependencies]
vstd = { version = "=0.0.0-2026-11-22-0344", default-features = false, features = ["alloc"] }
wcontainers-byte-sink = { path = "../../../byte-sink" }
wcontainers-byte-source = { path = "../../../byte-source" }
wcontainers-capability-table = { path = "../../../capability-table" }
wcontainers-kernel-core = { path = "../../../kernel-core" }
wcontainers-memory-capability-table = { path = "../../../memory-capability-table" }
wcontainers-memory-shard = { path = "../.." }
wcontainers-volatile-bytes = { path = "../../../volatile-bytes" }

[dev-dependencies]
wcontainers-memory-capability-table-conformance = { path = "../../../memory-capability-table/conformance" }
wcontainers-memory-shard-conformance = { path = "../../conformance" }

[package.metadata.verus]
verify = true

[lints]
workspace = true
