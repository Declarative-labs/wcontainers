[package]
name = "wcontainers-translator"
description = "Translates ARM64 machine code into WebAssembly."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wcontainers-abi.workspace = true
wcontainers-arm64 = { path = "../wcontainers-arm64" }
wasm-encoder = "0.263.0"
blake3 = "1"
petgraph = { version = "0.8.3", default-features = false, features = ["std"] }
# Plans and emits functions on every core; where threads cannot start (wasm32), on the calling thread.
rayon = "1.12.0"
# A fast hash for maps keyed by code offsets.
rustc-hash = "2.1.3"

[features]
# Makes `Omit` and `translate_omitting` public: output without some checks, only for measuring what each
# check costs. That output is not correct, so nothing but measuring tools turns this on.
measure = []

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
wasmparser = "0.263.0"
