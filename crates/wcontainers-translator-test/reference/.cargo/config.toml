[build]
target = "aarch64-unknown-linux-musl"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
# Linked at 2 GiB, above every address a test gives the guest, so the heap Linux places at a random distance after
# the runner (up to 1 GiB) never lands where a blob or its stack is mapped. (Static start code must stay within 4 GiB
# of address 0.) The start of `layout::aarch64::RUNNER`, which the runner checks.
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=--image-base=0x80000000"]

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
# Not position independent (the target's default is a static PIE, which Linux loads at a random high
# address), linked at 1.5 GiB, above every address a test gives the guest: the start code calls undefined
# weak functions at address 0, so the image must sit within 2 GiB of it. The start of `layout::x86_64::RUNNER`,
# which the runner checks; the harness keeps every case's accesses out of that range.
rustflags = ["-C", "target-feature=+crt-static", "-C", "relocation-model=static", "-C", "link-arg=--image-base=0x60000000"]
