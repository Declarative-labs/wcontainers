# The native reference runner. It is built for aarch64-unknown-linux-musl or x86_64-unknown-linux-musl and run
# on real Linux of that CPU, so it is its own workspace and pulls in nothing the host side needs.
[package]
name = "wcontainers-reference"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
libc = "0.2.191"

[target.'cfg(target_arch = "x86_64")'.dependencies]
# Tells which instructions the trap flag stops part way (rep string instructions and gathers), and encodes
# the moves to and from segment registers the runner uses.
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "encoder", "instr_info"] }

[profile.release]
panic = "abort"

[workspace]
