[package]
name = "wcontainers-translator-test"
description = "Runners, reference and random cases that prove the translator against real Linux of each guest CPU."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wcontainers-abi.workspace = true
wcontainers-arm64 = { path = "../wcontainers-arm64" }
wcontainers-guest-cpu = { path = "../wcontainers-guest-cpu" }
wcontainers-translator = { path = "../wcontainers-translator", features = ["measure"] }
wasmtime = { version = "50.0.1", default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "gc", "gc-drc", "threads", "parallel-compilation"] }
wasm-encoder = "0.263.0"
proptest = "1.12.0"
dynasmrt = "5.1.0"
serde_json = "1"
object = { version = "0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
gimli = { version = "0.34.0", default-features = false, features = ["read", "std"] }
zerocopy.workspace = true
rayon = "1.12.0"
# Hashes of translated output and of drawn cases in the lists compared between commits.
blake3 = "1"
# The reference runner's content hash, under which it is kept on an SSH reference and checked there by
# `sha256sum`.
sha2 = "0.10.9"
# Reads a translated module's lookup table, to number its pieces' functions (src/bin/machine-code.rs).
wasmparser = "0.263.0"
rustc-hash = "2.1.3"
# Bounds each zig build (src/programs.rs).
wait-timeout = "0.2.1"

[dev-dependencies]
flate2 = "1.1"

[lints]
workspace = true
