[package]
name = "wcontainers-processor-architecture-arm64"
description = "The ARM64 architecture: what every privilege level has, and what one level adds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lib]
path = "implementation.rs"

[[test]]
name = "conformance"
path = "conformance_run.rs"

# PLANTED BUGS: every bug the checks planted, one at a time, against the chip
[[example]]
name = "planted_bugs"
path = "planted_bugs.rs"
required-features = ["planted"]

[features]
# Lets a check turn on one planted bug of `planted::PLANTED_BUGS`; nothing else turns it on.
planted = []
# Lets every instruction and behavior write itself as a Rust expression that names each variant by its full path.
bake = ["dep:databake"]

[dependencies]
wcontainers-processor-architecture = { path = "../.." }
wcontainers-privilege-level = { path = "../../../privilege-level" }
wcontainers-privilege-level-arm64-user = { path = "../../../privilege-level/implementation/arm64-user" }
bitflags.workspace = true
databake = { workspace = true, optional = true }

[dev-dependencies]
wcontainers-behavior-source = { path = "../../../behavior-source" }
wcontainers-processor-architecture-conformance = { path = "../../conformance" }
wcontainers-distinguishing-state-generator = { path = "../../../distinguishing-state-generator" }
wcontainers-distinguishing-state-generator-arm64 = { path = "../../../distinguishing-state-generator/implementation/arm64" }

# The chip the planted bugs are measured on.
[target.'cfg(all(target_arch = "aarch64", target_os = "linux"))'.dev-dependencies]
wcontainers-behavior-source-kvm-single-step = { path = "../../../behavior-source/implementation/kvm-single-step" }

[lints]
workspace = true
