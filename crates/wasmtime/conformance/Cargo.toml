[package]
name = "wcontainers-wasmtime-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "suite.rs"

[target.'cfg(target_os = "linux")'.dependencies]
wcontainers-wasmtime = { path = ".." }
wasmtime = { version = "50.0.1", default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "gc", "gc-drc", "threads", "parallel-compilation"] }
# The module whose loads and stores reach a store's memory.
wasm-encoder = "0.263.0"
# Memory files, their seals and their bytes, and the host's page size.
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "param"] }
wcontainers-abi.workspace = true
wcontainers-executor = { path = "../../executor" }
wcontainers-volatile-bytes = { path = "../../volatile-bytes" }

[lints]
workspace = true
