[package]
name = "wcontainers-shaders"
description = "Turns Direct3D shader bytecode (DXBC, DXIL) into the common form of wcontainers-gpu, with its reflection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wcontainers-gpu = { path = "../wcontainers-gpu" }
naga = { workspace = true }
blake3 = { version = "1", default-features = false }

[build-dependencies]
cc = { version = "1", features = ["parallel"] }

[dev-dependencies]
naga = { workspace = true, features = ["wgsl-in", "glsl-out", "wgsl-out"] }

[lints]
workspace = true

[[example]]
name = "wasm_imports"
crate-type = ["cdylib"]
