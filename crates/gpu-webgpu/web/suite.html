<!doctype html>
<meta charset="utf-8">
<title>WebGPU back end suite</title>
<script type="module">
// Runs one test of the shared back-end suite through the WebGPU back end built for WebAssembly
// (pkg/scenes.js): ?test=<name>. Sets window.done to { ok, message } when it ends; a failing test
// panics and the module traps, so a page runs one test.
import init, { suite_test } from './pkg/scenes.js';
const params = new URLSearchParams(location.search);
let canvas = null;
let panic = '';
window.makeCanvas = () => {
  canvas = document.createElement('canvas');
  document.body.append(canvas);
  return canvas;
};
// What the canvas shows, as a PNG file: toDataURL copies the frame presented in this task, which the
// browser composites at the task's end (drawImage and createImageBitmap of a WebGPU canvas give
// transparent black in the rig's headless Chrome 157).
window.shownPng = () => Uint8Array.from(atob(canvas.toDataURL('image/png').split(',')[1]), (c) => c.charCodeAt(0));
window.panicked = (message) => { panic = message; };
try {
  await init();
  await suite_test(params.get('test'));
  window.done = { ok: true, message: '' };
} catch (e) {
  window.done = { ok: false, message: panic || String(e) };
}
</script>
