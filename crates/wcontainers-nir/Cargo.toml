[package]
name = "wcontainers-nir"
description = "NIR, the shader form Mesa's drivers receive, into the common form of wcontainers-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake3 = { version = "1", default-features = false }
naga = { workspace = true, features = ["spv-in"] }
spirv = "0.4"
wcontainers-gpu = { path = "../wcontainers-gpu" }
wcontainers-shaders = { path = "../wcontainers-shaders" }

[dev-dependencies]
ash = { version = "0.38", default-features = false, features = ["std", "debug"] }
libloading = "0.8"
wcontainers-gpu = { path = "../wcontainers-gpu" }
naga = { workspace = true, features = ["spv-in", "spv-out", "wgsl-in"] }
rand = "0.9.2"
rand_chacha = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[test]]
name = "corpus"
path = "tests/corpus/main.rs"
harness = false

[build-dependencies]
blake3 = { version = "1", default-features = false }
cc = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
