# Meson machine file for the pinned Mesa: llvmpipe (the OpenGL reference), lavapipe (the Vulkan
# reference), Zink (its NIR to SPIR-V compiler is one candidate route), the standalone GLSL and NIR
# tools, and EGL on the surfaceless platform so the references run without a display.
[built-in options]
buildtype = 'debugoptimized'

[project options]
gallium-drivers = ['llvmpipe', 'zink']
vulkan-drivers = ['swrast']
platforms = []
opengl = true
egl = 'enabled'
gles1 = 'disabled'
gles2 = 'enabled'
gbm = 'disabled'
glx = 'disabled'
glvnd = 'disabled'
llvm = 'enabled'
shared-llvm = 'enabled'
tools = ['glsl', 'nir']
build-tests = false
shader-cache = 'disabled'
spirv-tools = 'disabled'
xmlconfig = 'disabled'
zstd = 'disabled'
valgrind = 'disabled'
libunwind = 'disabled'
lmsensors = 'disabled'
video-codecs = []
gallium-va = 'disabled'
gallium-rusticl = false
teflon = false
