# Meson machine file for the pinned Mesa on Windows: the WGL frontend's opengl32.dll with our driver
# and llvmpipe (OpenGL's software reference), OpenGL ES contexts through WGL, built with the Visual C++ compiler.
[built-in options]
buildtype = 'release'
b_vscrt = 'mt'

[project options]
gallium-drivers = ['wcontainers', 'llvmpipe']
vulkan-drivers = []
platforms = ['windows']
opengl = true
egl = 'disabled'
gles1 = 'disabled'
gles2 = 'enabled'
gbm = 'disabled'
glx = 'disabled'
llvm = 'enabled'
shared-llvm = 'disabled'
build-tests = false
shader-cache = 'disabled'
spirv-tools = 'disabled'
xmlconfig = 'disabled'
zstd = 'disabled'
video-codecs = []
gallium-va = 'disabled'
gallium-rusticl = false
teflon = false
