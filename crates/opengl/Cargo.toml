[package]
name = "wcontainers-opengl"
description = "OpenGL for wcontainers: a Gallium driver for Mesa's OpenGL state tracker, drawing through wcontainers-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
naga = { workspace = true }
pollster = "1.0.1"
wcontainers-gpu = { path = "../gpu" }
wcontainers-gpu-webgpu = { path = "../gpu/implementation/webgpu" }
wcontainers-mesa-compiler-direct = { path = "../mesa-compiler/implementation/direct" }
wcontainers-nir = { path = "../nir", default-features = false }
wcontainers-shaders = { path = "../shaders" }
wgpu = { version = "30.0.2", default-features = false, features = ["std", "dx12", "vulkan"] }
zerocopy = { workspace = true }

[target.'cfg(windows)'.dependencies]
libloading = "0.8.9"
# The window a program's device context draws into.
wcontainers-win32 = { path = "../win32" }
wcontainers-win32-windows = { path = "../win32/implementation/windows" }

[dev-dependencies]
wcontainers-gpu-recording = { path = "../gpu/implementation/recording" }

[build-dependencies]
bindgen = "0.71.1"
build-rs = "0.3.6"
cc = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
