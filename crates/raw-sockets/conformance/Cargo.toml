[package]
name = "wcontainers-raw-sockets-conformance"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "conformance.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-configurable-conformance = { path = "../../configurable/conformance" }
wcontainers-internet-protocol = { path = "../../internet-protocol" }
wcontainers-raw-sockets = { path = ".." }
etherparse.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The packet capture, address and network tools of the ICMP suite.
wcontainers-icmp-sockets-conformance = { path = "../../icmp-sockets/conformance" }
wcontainers-readiness = { path = "../../readiness" }
wcontainers-readiness-conformance = { path = "../../readiness/conformance" }
# The errno values of Linux.
libc = "0.2.191"
# The routing header type of Linux.
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["net", "no_std"] }
# The network namespaces of a check, raw ICMP sockets and the monotonic clock.
rustix = { version = "1.1.6", features = ["fs", "net", "thread", "time"] }
