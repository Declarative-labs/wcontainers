[package]
name = "wcontainers-raw-sockets-host"
description = "RawSockets on the raw IP sockets of the Linux machine it runs on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-configurable = { path = "../../../configurable" }
wcontainers-raw-sockets = { path = "../.." }
wcontainers-internet-protocol = { path = "../../../internet-protocol" }
wcontainers-kernel = { path = "../../../kernel" }
wcontainers-readiness = { path = "../../../readiness" }
etherparse.workspace = true
wcontainers-internet-protocol-linux-socket-options = { path = "../../../internet-protocol/implementation/linux-socket-options" }
wcontainers-volatile-bytes = { path = "../../../volatile-bytes" }

[target.'cfg(target_os = "linux")'.dependencies]
# The source a receive gives the bytes it reaches.
wcontainers-byte-source = { path = "../../../byte-source" }
# Socket calls and socket addresses.
rustix = { version = "1.1.6", features = ["net"] }
# The socket options socket2 covers, on the socket's descriptor.
socket2 = { version = "0.6.5", features = ["all"] }
# The Linux uapi constants and structures of sockets.
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["net", "no_std"] }
# getsockopt for SO_MEMINFO and the errno values.
libc = "0.2.191"
# Where an IPv6 send from a source by a bound interface leaves.
wcontainers-route-resolver = { path = "../../../route-resolver" }
wcontainers-route-resolver-host = { path = "../../../route-resolver/implementation/host" }

[[test]]
name = "conformance"
path = "conformance_run.rs"

[dev-dependencies]
wcontainers-raw-sockets-conformance = { path = "../../conformance" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2.191"
# Counts the allocations of the waiting test (MIT).
stats_alloc = "0.1.10"

[lints]
workspace = true
