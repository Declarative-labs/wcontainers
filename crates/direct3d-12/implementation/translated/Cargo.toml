[package]
name = "wcontainers-direct3d-12-translated"
description = "The wcontainers Direct3D 12 front, written from Microsoft's documentation, on the wcontainers graphics interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wcontainers-gpu = { path = "../../../gpu" }
wcontainers-directx-graphics-infrastructure = { path = "../../../directx-graphics-infrastructure/implementation/translated", package = "wcontainers-directx-graphics-infrastructure-translated" }
wcontainers-shaders = { path = "../../../shaders" }
slab = "0.4"
half = { version = "2.7.1", default-features = false }
bytemuck = { version = "1.25.2", features = ["derive"] }
naga = { workspace = true }

[dev-dependencies]
wcontainers-gpu-webgpu = { path = "../../../gpu-webgpu" }
wgpu = { version = "30.0.2", default-features = false, features = ["std", "dx12", "metal", "vulkan", "webgpu", "naga-ir"] }
pollster = "1.0.1"
blake3 = { version = "1", default-features = false }
png = "0.18.1"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"

# The Windows library and its two forwarders (examples/directx/main.rs says why they are examples).
[[example]]
name = "wcontainers_d3d12"
path = "examples/directx/main.rs"
crate-type = ["cdylib"]

[[example]]
name = "d3d12"
crate-type = ["cdylib"]

[[example]]
name = "dxgi"
crate-type = ["cdylib"]

[lints]
workspace = true
