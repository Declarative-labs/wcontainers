[package]
name = "wcontainers-executor-conformance"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "suite.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-byte-sink = { path = "../../byte-sink" }
wcontainers-byte-source = { path = "../../byte-source" }
wcontainers-volatile-bytes = { path = "../../volatile-bytes" }
wcontainers-executor = { path = ".." }
wcontainers-processor-architecture = { path = "../../processor-architecture" }
wcontainers-precise-instruction-set = { path = "../../precise-instruction-set" }
wcontainers-distinguishing-state-generator = { path = "../../distinguishing-state-generator" }
# The one rule for whether two lists of memory changes leave the same memory.
wcontainers-processor-architecture-conformance = { path = "../../processor-architecture/conformance" }
# The ARM64 guests: the architecture's processor state and exceptions, the encoder of its instructions, and the
# exception classes of ESR_EL1 the architecture crate builds its syndromes from (the version it uses).
wcontainers-processor-architecture-arm64 = { path = "../../processor-architecture/implementation/arm64" }
wcontainers-arm64 = { path = "../../wcontainers-arm64" }
aarch64-cpu = "12.0.0"
# The ghost token argument the page methods take (erased: a caller outside the proof passes `Tracked::assume_new()`).
vstd.workspace = true

[lints]
workspace = true
