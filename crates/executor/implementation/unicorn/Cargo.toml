[package]
name = "wcontainers-executor-unicorn"
description = "Runs wcontainers-kernel-linux on a stand-in CPU and compares it with real ARM64 Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# unicorn-engine is GPL-2.0, so this crate is test-only and never shipped.
license = "GPL-2.0-only"
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[[bin]]
name = "generate-linux"
path = "bin/generate-linux.rs"

[[bin]]
name = "ltp"
path = "bin/ltp.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-kernel = { path = "../../../kernel" }
wcontainers-kernel-linux = { path = "../../../kernel/implementation/linux" }
wcontainers-runtime-single-kernel = { path = "../../../runtime/implementation/single-kernel" }
wcontainers-docker = { path = "../../../wcontainers-docker" }
# The seeded choices of a run, shared with the native back end's inside.
wcontainers-system-seeded-test-policy = { path = "../../../system/implementation/seeded-test-policy" }
wcontainers-system = { path = "../../../system" }
wcontainers-clock = { path = "../../../clock" }
wcontainers-random-source = { path = "../../../random-source" }
wcontainers-tcp-sockets = { path = "../../../tcp-sockets" }
wcontainers-udp-sockets = { path = "../../../udp-sockets" }
wcontainers-readiness = { path = "../../../readiness" }
wcontainers-internet-protocol = { path = "../../../internet-protocol" }
wcontainers-configurable = { path = "../../../configurable" }
wcontainers-negative-route-advisable = { path = "../../../negative-route-advisable" }
wcontainers-executor = { path = "../.." }
wcontainers-processor-architecture = { path = "../../../processor-architecture" }
wcontainers-processor-architecture-arm64 = { path = "../../../processor-architecture/implementation/arm64" }
# Single instruction execution on any CPU side of the abi, shared with the WebAssembly executor.
wcontainers-executor-wasmtime = { path = "../wasmtime" }
wcontainers-precise-instruction-set = { path = "../../../precise-instruction-set" }
wcontainers-precise-instruction-set-unicorn = { path = "../../../precise-instruction-set/implementation/unicorn" }
wcontainers-arm64 = { path = "../../../wcontainers-arm64", optional = true }
unicorn-engine = "2.1.5"
memmap2 = "0.9.12"
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["general", "errno", "auxvec", "system", "ioctl", "prctl", "net", "ptrace", "netlink", "if_arp", "elf_uapi", "no_std"] }
cargo_metadata = "0.23.1"
libc = "0.2.191"
regex = "1.13.1"
rand = "0.9.2"
domain = { version = "0.12.3", default-features = false, features = ["alloc"] }
tar = "0.4.46"
proptest = "1.12.0"
fuse-abi = { version = "0.2.0", default-features = false, features = ["linux", "zerocopy"] }
zerocopy.workspace = true
coarsetime = "0.1.38"

[dev-dependencies]
wcontainers-executor-conformance = { path = "../../conformance" }
wcontainers-distinguishing-state-generator-input-domain = { path = "../../../distinguishing-state-generator/implementation/input-domain" }
wcontainers-instruction-input-domain-arm64 = { path = "../../../instruction-input-domain/implementation/arm64" }
wcontainers-precise-instruction-set-apple-m5 = { path = "../../../precise-instruction-set/implementation/apple-m5" }
wcontainers-precise-instruction-set-neoverse-v2 = { path = "../../../precise-instruction-set/implementation/neoverse-v2" }

[[test]]
name = "conformance"
path = "conformance.rs"

[features]
# Every test runs with the translator's WebAssembly behind the kernel (the runtime's WebAssembly back end)
# instead of the stand-in CPU, at the look-ahead `LOOK_AHEAD` names: full (also when unset), none or bounded.
runtime = ["dep:wcontainers-arm64"]

[lints]
workspace = true
