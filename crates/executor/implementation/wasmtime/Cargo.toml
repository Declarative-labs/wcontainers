[package]
name = "wcontainers-executor-wasmtime"
description = "The WebAssembly executor of the wcontainers runtime: the translator's output run by wasmtime behind the kernel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "implementation.rs"

[[bin]]
name = "wcon"
path = "bin/wcon.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-runtime-single-kernel = { path = "../../../runtime/implementation/single-kernel" }
# The words wcon shares with `docker run`.
wcontainers-docker = { path = "../../../wcontainers-docker" }
wcontainers-translator = { path = "../../../wcontainers-translator" }
wcontainers-guest-cpu = { path = "../../../wcontainers-guest-cpu" }
wasmtime = { version = "50.0.1", default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "gc", "gc-drc", "threads", "parallel-compilation"] }
# The hook types the guest interface describes are wasm-encoder's.
wasm-encoder = "0.263.0"
rustix = { version = "1.1.6", features = ["mm", "param"] }
blake3 = "1"
object = { version = "0.41", default-features = false, features = ["read_core", "elf"] }
gimli = { version = "0.34.0", default-features = false, features = ["read"] }
rayon = "1.12.0"
zerocopy.workspace = true
# The demonstration program's guest and its arguments.
wcontainers-arm64 = { path = "../../../wcontainers-arm64" }
pico-args = "0.5.0"
# Writes a cache file whole under a name of its own, then puts it in place.
tempfile = "3.27.0"
# A cache file's body.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"

[target.'cfg(target_os = "macos")'.dependencies]
# The fork copy: the system's own exact copy of a range of pages.
mach2 = "0.6.0"

[build-dependencies]
blake3 = "1"
# Cargo's own reading of a build script's input and writing of its instructions.
build-rs = "0.3.6"
# The workspace's crates and the lock file, to find the guests and what they are built from.
cargo_metadata = "0.23.1"
cargo-lock = "11.1.0"

[dev-dependencies]
# Copies the test process with fork, as the kernel tests' saves do.
libc = "0.2.191"
# Unpacks the OCI image `docker save` writes, and makes roots for tests.
tar = "0.4.46"
# Writes configurations field by field.
serde_json = "1.0.154"
# Makes the zstd twin of the OCI image: its gzip layers read, compressed by libzstd and digested.
flate2 = "1.1.11"
zstd = "0.13.5"
sha2 = "0.10.9"

[lints]
workspace = true
