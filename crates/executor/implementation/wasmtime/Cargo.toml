[package]
name = "wcontainers-executor-wasmtime"
description = "The WebAssembly executor: the translator's output for ARM64 run by wasmtime behind the executor interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-executor = { path = "../.." }
wcontainers-behavior-source = { path = "../../../behavior-source" }
wcontainers-processor-architecture = { path = "../../../processor-architecture" }
wcontainers-processor-architecture-arm64 = { path = "../../../processor-architecture/implementation/arm64" }
wcontainers-volatile-bytes = { path = "../../../volatile-bytes" }
wcontainers-byte-sink = { path = "../../../byte-sink" }
wcontainers-byte-source = { path = "../../../byte-source" }
wcontainers-translator = { path = "../../../translator" }
wcontainers-guest-cpu = { path = "../../../guest-cpu" }
# The ARM64 guest the translator is given, and the words of its thread state.
wcontainers-arm64 = { path = "../../../arm64" }
# wasmtime's uses that need unsafe: host memories over memory files, and the trap handler its hooks reach.
wcontainers-wasmtime = { path = "../../../wasmtime" }
wcontainers-wasmtime-direct = { path = "../../../wasmtime/implementation/direct" }
wasmtime = { version = "50.0.1", default-features = false, features = ["anyhow", "cranelift", "runtime", "std", "gc", "gc-drc", "threads", "parallel-compilation"] }
# The module that reaches the state memory with WebAssembly's own loads and stores.
wasm-encoder = "0.263.0"
# Memory files: made, sealed, their holes punched and their data found, all with safe calls.
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }
# The key a translation is kept under: the hash of the code it was made from.
blake3 = "1"
zerocopy.workspace = true
thiserror = { version = "2.0.21", default-features = false }

[dev-dependencies]
wcontainers-executor-conformance = { path = "../../conformance" }
wcontainers-volatile-bytes-conformance = { path = "../../../volatile-bytes/conformance" }
wcontainers-behavior-source-conformance = { path = "../../../behavior-source/conformance" }
wcontainers-precise-instruction-set = { path = "../../../precise-instruction-set" }
# The set the agreement test compares with: the behaviors this executor shows, measured.
wcontainers-precise-instruction-set-measured = { path = "../../../precise-instruction-set/implementation/measured" }
# The ten slice instructions and the choices the translator was written to make for them.
wcontainers-precise-instruction-set-translator = { path = "../../../precise-instruction-set/implementation/translator" }
wcontainers-distinguishing-state-generator = { path = "../../../distinguishing-state-generator" }
wcontainers-distinguishing-state-generator-arm64 = { path = "../../../distinguishing-state-generator/implementation/arm64" }

[[test]]
name = "conformance"
path = "conformance_run.rs"

[[test]]
name = "volatile_bytes"
path = "volatile_bytes.rs"

[lints]
workspace = true
