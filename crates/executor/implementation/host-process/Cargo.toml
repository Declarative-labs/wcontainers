[package]
name = "wcontainers-executor-host-process"
description = "The wcontainers executor that runs each guest process as a host process, with no virtual machine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

autotests = false

[lib]
path = "implementation.rs"

[features]
# The tests that run guest programs on the kernel beside the wasmtime and unicorn executors: they build once those
# executors build on the owner's interfaces and the kernel takes an executor without the abi's `Cpu`.
tests-on-other-tracks = [
    "dep:wcontainers-kernel-linux",
    "dep:wcontainers-runtime-single-kernel",
    "dep:wcontainers-system-seeded-test-policy",
    "dep:wcontainers-system",
    "dep:wcontainers-clock",
    "dep:wcontainers-random-source",
    "dep:wcontainers-readiness",
    "dep:wcontainers-executor-wasmtime",
    "dep:wcontainers-executor-unicorn",
]

[target.'cfg(target_os = "linux")'.dependencies]
wcontainers-abi.workspace = true
# Host calls: memfds, mappings, the zygote's socket, processes and CPU placement.
rustix = { version = "1.1.6", features = ["event", "fs", "mm", "net", "param", "process", "thread", "time"] }
# The layouts of a socket message and a seccomp filter,
# where rustix has none.
libc = "0.2.191"
# Linux's numbers for the zygote's and the stubs' own host calls and filter.
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["errno", "general", "net", "prctl", "ptrace", "no_std"] }
# Each memory's permissions and its borrowed and lent pages, by range.
rangemap = { version = "1.8.0", default-features = false }
# A register block as the words of its register page.
zerocopy.workspace = true
# A stub process's CPU clock, for placement's samples: rustix has none.
nix = { version = "0.31.3", default-features = false, features = ["process", "time"] }
# The embedder's mappings of a stub's thread pages and code area, made and unmapped without unsafe code of ours.
memmap2 = "0.9.12"
# The ELF header and program headers of the zygote's executable image, and its code read from the embedder's own.
object = { version = "0.41.0", default-features = false, features = ["elf", "read_core", "std"] }
# The host's calls and instructions no safe crate offers: a signal to one stub thread, the user-space search's fixed
# pages, the thread pages as atomic words, and on ARM64 the cache type, cache maintenance and the SVE probe.
wcontainers-linux-process = { path = "../../../linux-process" }
wcontainers-linux-process-direct = { path = "../../../linux-process/implementation/direct" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Moving, stopping and killing the zygote and its stubs from outside, and the permissions of their mappings.
rustix = { version = "1.1.6", features = ["fs", "mm", "process", "thread"] }
# Seeded order of the stop test's turns.
fastrand = "2.5.0"
# Tracing one stub thread to step it and send its stop at every instruction of a turn.
nix = { version = "0.31.3", default-features = false, features = ["process", "pthread", "ptrace", "signal"] }
# A handler for the signals sent at the embedder's thread while it waits on its stubs.
signal-hook = "0.3.18"

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
# Where translated code finds its slots, its floor entries and its register page, and the words a loader fills.
wcontainers-arm64 = { path = "../../../arm64" }
# Guest code translated for the process way, its position map, and its stops resolved to the guest's state.
wcontainers-translator = { path = "../../../translator", features = ["native"] }
wcontainers-guest-cpu = { path = "../../../guest-cpu" }
wcontainers-executor-arm64-stop = { path = "../arm64-stop" }
# The executor interface, the behavior source it extends, its ARM64 processor state, and the exception class of a
# stub gone.
wcontainers-executor = { path = "../.." }
wcontainers-behavior-source = { path = "../../../behavior-source" }
wcontainers-volatile-bytes = { path = "../../../volatile-bytes" }
wcontainers-byte-sink = { path = "../../../byte-sink" }
wcontainers-byte-source = { path = "../../../byte-source" }
wcontainers-processor-architecture = { path = "../../../processor-architecture" }
wcontainers-processor-architecture-arm64 = { path = "../../../processor-architecture/implementation/arm64" }
aarch64-cpu = "12.0.0"
# The hash of every return's position, the virtual-machine executor's, so the two compare.
rustc-hash = { version = "2.1.3", default-features = false }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dev-dependencies]
# The floor test's pieces, standing in for translated code, in the native output's own encodings.
wcontainers-arm64 = { path = "../../../arm64" }
# Translated code of the process way, its position map, and its stops resolved, in the translated test.
wcontainers-translator = { path = "../../../translator", features = ["native"] }
wcontainers-guest-cpu = { path = "../../../guest-cpu" }
wcontainers-executor-arm64-stop = { path = "../arm64-stop" }
wcontainers-executor = { path = "../.." }
wcontainers-volatile-bytes = { path = "../../../volatile-bytes" }
wcontainers-processor-architecture = { path = "../../../processor-architecture" }
wcontainers-processor-architecture-arm64 = { path = "../../../processor-architecture/implementation/arm64" }
# The in-process way's test runs translated code in the emulator (GPL-2.0, test only, as the virtual-machine form's
# tests use it).
unicorn-engine = "2.1.5"
# The differential test's cases, its draws and the WebAssembly output it compares with.
wcontainers-translator-test = { path = "../../../translator-test" }
proptest = "1.12.0"
# The executor interface's suite, against a Neoverse V2's recorded behaviors on the states the ARM64 generator makes.
wcontainers-executor-conformance = { path = "../../conformance" }
wcontainers-behavior-source = { path = "../../../behavior-source" }
wcontainers-behavior-source-recording = { path = "../../../behavior-source/implementation/recording" }
wcontainers-precise-instruction-set = { path = "../../../precise-instruction-set" }
wcontainers-precise-instruction-set-measured = { path = "../../../precise-instruction-set/implementation/measured" }
wcontainers-distinguishing-state-generator-arm64 = { path = "../../../distinguishing-state-generator/implementation/arm64" }

# The waiting tests' crates, under `tests-on-other-tracks`: the kernel, its loop with containers, the seeded policy and
# the host's services it calls; the WebAssembly and emulator executors to compare with.
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies.wcontainers-kernel-linux]
path = "../../../kernel/implementation/linux"
optional = true
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies.wcontainers-runtime-single-kernel]
path = "../../../runtime/implementation/single-kernel"
optional = true
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies.wcontainers-system-seeded-test-policy]
path = "../../../system/implementation/seeded-test-policy"
optional = true
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies.wcontainers-system]
path = "../../../system"
optional = true
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies.wcontainers-clock]
path = "../../../clock"
optional = true
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies.wcontainers-random-source]
path = "../../../random-source"
optional = true
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies.wcontainers-readiness]
path = "../../../readiness"
optional = true
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies.wcontainers-executor-wasmtime]
path = "../wasmtime"
optional = true
[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies.wcontainers-executor-unicorn]
path = "../unicorn"
optional = true

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies]
# Finding the host call a traced stub thread is about to make, in the step test.
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder"] }

[[test]]
name = "zygote"

[[test]]
name = "stub"

[[test]]
name = "files"

[[test]]
name = "host"

[[test]]
name = "threads"

[[test]]
name = "stop"

[[test]]
name = "touch"

[[test]]
name = "memory"

[[test]]
name = "slice"

[[test]]
name = "placement"

[[test]]
name = "embedder"

[[test]]
name = "floor"

[[test]]
name = "step"

[[test]]
name = "translated"

[[test]]
name = "run"

[[test]]
name = "kernel"
required-features = ["tests-on-other-tracks"]

[[test]]
name = "busybox"
required-features = ["tests-on-other-tracks"]

[[test]]
name = "speed"
required-features = ["tests-on-other-tracks"]

[[test]]
name = "conformance"
path = "conformance_run.rs"

[[test]]
name = "interrupt"

[[test]]
name = "copy"

[[test]]
name = "forged"

[[test]]
name = "differential"

[[test]]
name = "in_process_way"

[[test]]
name = "in_process_cost"

[[test]]
name = "in_process_speculation"

[[test]]
name = "in_process_attacks"

# The zygote's two assembly modules carry their own `#[expect(unsafe_code, reason = "..")]`; nothing else here uses it.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
