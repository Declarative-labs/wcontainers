[package]
name = "wcontainers-executor-hardware-virtualization"
description = "The wcontainers native back end's monitor: makes the virtual machine, loads the inside, runs its virtual CPUs and answers the link."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-executor-hardware-virtualization-inside = { path = "../hardware-virtualization-inside" }
# What the guest's architecture says the floor sets up (stack pointer alignment).
wcontainers-arm64 = { path = "../../../wcontainers-arm64" }
wcontainers-guest-cpu = { path = "../../../wcontainers-guest-cpu" }
# The inside's translations, made by the monitor.
wcontainers-translator = { path = "../../../wcontainers-translator", features = ["native"] }
# Reading the inside's ELF image.
object = { version = "0.37.3", default-features = false, features = ["read_core", "elf"] }
libc = "0.2.178"
# Exception syndrome fields.
aarch64-cpu = "12.0.0"
# Page table entry bits of the single step executor's tables, as the inside uses them.
aarch64-paging = { version = "0.12.3", default-features = false }
# The single step executor: the trait it implements and the ARM64 state it runs.
wcontainers-executor = { path = "../.." }
wcontainers-processor-architecture = { path = "../../../processor-architecture" }
wcontainers-processor-architecture-arm64 = { path = "../../../processor-architecture/implementation/arm64" }
# The guest memory's borrowed bytes, and where they are read to and written from.
wcontainers-volatile-bytes = { path = "../../../volatile-bytes" }
wcontainers-byte-sink = { path = "../../../byte-sink" }
wcontainers-byte-source = { path = "../../../byte-source" }
# The files of kept translations: their names and the running program's build, and their contents.
blake3 = "1"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
# Writes a kept translation whole under a name of its own, then puts it in place.
tempfile = "3.27.0"
# The inside's image as aligned words, guest records as bytes, and zeroed links in tests.
zerocopy = { workspace = true, features = ["alloc"] }

[target.'cfg(target_os = "macos")'.dependencies]
applevisor = "1.0.0"
applevisor-sys = "1.0.0"

[target.'cfg(all(target_os = "linux", target_arch = "aarch64"))'.dependencies]
# KVM's calls and structures, and the raw calls kvm-ioctls does not wrap.
kvm-ioctls = "0.25.1"
kvm-bindings = "0.14.2"
vmm-sys-util = "0.15.0"
# The first interrupt number the host raises.
arm-gic = "0.11.0"
# The calling thread's id, which the stop signal is sent to.
rustix = { version = "1.1.6", features = ["thread"] }

[build-dependencies]
# The names of the build environment.
wcontainers-executor-hardware-virtualization-inside = { path = "../hardware-virtualization-inside" }
# The call that sets a vector register, in C.
cc = "1.11.2"

[dev-dependencies]
# The stop test's seeded waits and the structure test's seeded words.
fastrand = "2.5.0"
# The host's page size.
rustix = { version = "1.1.6", features = ["param"] }
# Layer 1's cases and the WebAssembly output's outcomes, which the differential test compares with.
wcontainers-translator-test = { path = "../../../wcontainers-translator-test" }
proptest = "1.12.0"
# The exits test's other side: the WebAssembly output's CPU side, run as the runtime's loop runs it.
wcontainers-executor-wasmtime = { path = "../wasmtime" }
wcontainers-runtime-single-kernel = { path = "../../../runtime/implementation/single-kernel" }
# The kernel test's policy, the same on both sides.
wcontainers-system-seeded-test-policy = { path = "../../../system/implementation/seeded-test-policy" }
wcontainers-readiness = { path = "../../../readiness" }
wcontainers-system = { path = "../../../system" }
wcontainers-clock = { path = "../../../clock" }
wcontainers-random-source = { path = "../../../random-source" }
# The root's files at a container's end.
wcontainers-kernel-linux = { path = "../../../kernel/implementation/linux" }
# The busybox test's commands, reference image and check against the reference (GPL-2.0-only, test only).
wcontainers-executor-unicorn = { path = "../unicorn" }
# The register count's emulator (GPL-2.0, test only, as in wcontainers-executor-unicorn).
unicorn-engine = "2.1.5"
# The system calls the exits test answers, by Linux's numbers.
linux-raw-sys = { version = "0.12.1", default-features = false, features = ["general", "errno", "auxvec", "no_std"] }
# The executor suite, the chips' sets it agrees with and the states it runs.
wcontainers-executor-conformance = { path = "../../conformance" }
wcontainers-precise-instruction-set-apple-m5 = { path = "../../../precise-instruction-set/implementation/apple-m5" }
wcontainers-precise-instruction-set-neoverse-v2 = { path = "../../../precise-instruction-set/implementation/neoverse-v2" }
wcontainers-distinguishing-state-generator-input-domain = { path = "../../../distinguishing-state-generator/implementation/input-domain" }
wcontainers-instruction-input-domain-arm64 = { path = "../../../instruction-input-domain/implementation/arm64" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The speed test's counts of the whole process's cycles and instructions.
perf-event2 = "0.7.4"

[[test]]
name = "conformance"
path = "conformance_run.rs"

[[test]]
name = "exits"
harness = false

[[test]]
name = "kernel"
harness = false

[[test]]
name = "busybox"
harness = false

[[test]]
name = "floor"
harness = false

[[test]]
name = "native"
harness = false

[[test]]
name = "interrupts"
harness = false

[[test]]
name = "host_branches"
harness = false

[[test]]
name = "probe"
harness = false

[[test]]
name = "speed"
harness = false

[[test]]
name = "registers"
harness = false

# An executor may use unsafe code only where it carries its own `#[expect(unsafe_code, reason = "..")]`; a reason
# starting "UNSOUND:" or "UNEXPLAINED:" marks a use nobody has shown sound, and names what replaces it.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
