[package]
name = "wcontainers-executor-hardware-virtualization-inside"
description = "The program the wcontainers native back end runs in a virtual machine's privileged level: its floor (entry, page tables, interrupts, the link to the host)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-abi.workspace = true
# Where the translated code finds the entry mirror.
wcontainers-arm64 = { path = "../../../arm64", default-features = false }
# The position map, which stops are resolved with.
wcontainers-guest-cpu = { path = "../../../guest-cpu", default-features = false }
# The kernel, which runs inside.
wcontainers-kernel = { path = "../../../kernel" }
wcontainers-kernel-linux = { path = "../../../kernel/implementation/linux" }
wcontainers-readiness = { path = "../../../readiness" }
wcontainers-system = { path = "../../../system" }
wcontainers-clock = { path = "../../../clock" }
wcontainers-random-source = { path = "../../../random-source" }
# The loop, which runs inside beside the kernel.
wcontainers-runtime-single-kernel = { path = "../../../runtime/implementation/single-kernel", default-features = false }
# The kernel test crate's policy, for the test program `native-kernel` only.
wcontainers-system-seeded-test-policy = { path = "../../../system/implementation/seeded-test-policy", optional = true }
# The container's files and start as the link carries them.
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc"] }
# The position map, the container's files and its start as the link carries them.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
# The link's messages as words.
zerocopy.workspace = true
# Page table entry bits.
aarch64-paging = { version = "0.12.3", default-features = false }
# System register fields.
aarch64-cpu = "12.0.0"
arm-sysregs = { version = "0.5.2", features = ["el1"] }
# The interrupt controller.
arm-gic = "0.11.0"
# The doorbell's hypervisor call.
smccc = "0.2.3"
safe-mmio = "0.4.0"
# Locks shared by the virtual CPUs.
spin = { version = "0.10.0", default-features = false, features = ["spin_mutex", "lock_api"] }
# What each range of a process allows, and which ranges show a shared block.
rangemap = { version = "1.8.0", default-features = false }
# The hash of the positions of a CPU side's stops.
rustc-hash = { version = "2.1.3", default-features = false }
# The heap.
talc = { version = "5.1.1", default-features = false }

[features]
# The test program `native-kernel`, which runs the kernel test crate's policy.
kernel-test = ["dep:wcontainers-system-seeded-test-policy"]

[[bin]]
name = "floor-cases"
path = "bin/floor-cases/main.rs"

[[bin]]
name = "native-cases"
path = "bin/native-cases/main.rs"

[[bin]]
name = "native-exits"
path = "bin/native-exits/main.rs"

[[bin]]
name = "native-kernel"
path = "bin/native-kernel/main.rs"
required-features = ["kernel-test"]

[[bin]]
name = "native-untranslated"
path = "bin/native-untranslated/main.rs"

[build-dependencies]
wcontainers-abi.workspace = true
# The layout, which the build script reads too.
wcontainers-arm64 = { path = "../../../arm64", default-features = false }
# Assembles Arm's memcpy.
cc = "1.11.2"

[lints]
workspace = true
