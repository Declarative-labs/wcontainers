[package]
name = "wcontainers-precise-instruction-set-measured"
description = "The precise instruction set of a chip as measurements give it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[[test]]
name = "conformance"
path = "conformance_run.rs"

# DEFAULT BEHAVIORS: every modeled instruction measured on this host's chip, timed
[[example]]
name = "default_behaviors"
path = "default_behaviors.rs"

# STATE COUNTS: the full product and the cut of each class, and a hash of every generated state
[[example]]
name = "state_counts"
path = "state_counts.rs"

[dependencies]
wcontainers-precise-instruction-set = { path = "../.." }
wcontainers-processor-architecture = { path = "../../../processor-architecture" }

[dev-dependencies]
wcontainers-behavior-source = { path = "../../../behavior-source" }
wcontainers-behavior-source-recording = { path = "../../../behavior-source/implementation/recording" }
wcontainers-distinguishing-state-generator = { path = "../../../distinguishing-state-generator" }
wcontainers-distinguishing-state-generator-arm64 = { path = "../../../distinguishing-state-generator/implementation/arm64" }
wcontainers-instruction-input-domain = { path = "../../../instruction-input-domain" }
wcontainers-instruction-input-domain-arm64 = { path = "../../../instruction-input-domain/implementation/arm64" }
wcontainers-precise-instruction-set-conformance = { path = "../../conformance" }
wcontainers-processor-architecture-arm64 = { path = "../../../processor-architecture/implementation/arm64" }

# The chip the chip test measures.
[target.'cfg(all(target_arch = "aarch64", target_os = "linux"))'.dev-dependencies]
wcontainers-behavior-source-kvm-single-step = { path = "../../../behavior-source/implementation/kvm-single-step" }

[lints]
workspace = true
