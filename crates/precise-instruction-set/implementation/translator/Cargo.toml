[package]
name = "wcontainers-precise-instruction-set-translator"
description = "The behaviors the WebAssembly translator gives every ARM64 instruction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-precise-instruction-set = { path = "../.." }
wcontainers-processor-architecture-arm64 = { path = "../../../processor-architecture/implementation/arm64" }
# The CTR_EL0 value the translator presents.
wcontainers-arm64 = { path = "../../../arm64", default-features = false }

[lints]
workspace = true
