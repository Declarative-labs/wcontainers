[package]
name = "wcontainers-shaders"
description = "Turns Direct3D shader bytecode (DXBC, DXIL) into the common form of wcontainers-gpu, with its reflection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wcontainers-gpu = { path = "../gpu" }
naga = { workspace = true, features = ["spv-in", "wgsl-in", "serialize", "deserialize"] }
blake3 = { version = "1", default-features = false }
crc32fast = { version = "1", default-features = false }
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
spirv = "0.4"
rspirv = "0.13"
md-5 = { version = "0.11", default-features = false }
zerocopy.workspace = true
# The C++ converters, linked in (src/converters.rs).
wcontainers-shader-converters = { path = "../shader-converters" }
wcontainers-shader-converters-linked = { path = "../shader-converters/implementation/linked" }

# The converters' module, run under wasmtime natively with `contained-converters` (src/converters.rs).
[target.'cfg(not(target_os = "wasi"))'.dependencies]
wcontainers-shader-converters-contained = { path = "../shader-converters/implementation/contained", optional = true }

[features]
# Natively, runs the converters as their own WebAssembly module under wasmtime instead of linking
# their C++ into the process: what a shader makes them do ends in a trap or a bound of their instance,
# refused by name, instead of ending, exhausting or stalling the host; at the cost measured in
# docs/status-graphics-shaders.md. No effect in the crate's own WebAssembly build.
contained-converters = ["dep:wcontainers-shader-converters-contained"]

[build-dependencies]
blake3 = "1"

[dev-dependencies]
cap = "0.1.2"
fastrand = "2"
serde = { version = "1", features = ["derive"] }
naga = { workspace = true, features = ["wgsl-in", "glsl-out", "hlsl-out", "msl-out", "wgsl-out"] }

# tests/corpus.rs: GLSL ES as the WebGL 2 back end writes it.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
wcontainers-gpu-webgl = { path = "../gpu-webgl" }

# tests/draw.rs: real Direct3D 11 beside the WebGPU and WebGL 2 back ends.
[target.'cfg(windows)'.dev-dependencies]
pollster = "1.0.1"
wcontainers-gpu-webgpu = { path = "../gpu-webgpu" }
wcontainers-graphics-test = { path = "../graphics-test" }
wgpu = "30.0.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
] }


# TODO: remove this crate's 71 uses of unsafe, then replace this table with `[lints]` `workspace = true`.
[lints]
workspace = true
