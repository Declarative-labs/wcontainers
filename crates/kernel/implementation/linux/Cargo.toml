[package]
name = "wcontainers-kernel-linux"
description = "A Linux kernel for ARM64 guests, driven as a state machine through wcontainers-abi."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-abi.workspace = true
zerocopy.workspace = true
object = { version = "0.41", default-features = false, features = ["read_core", "elf", "unaligned"] }
siphasher = { version = "1.0.1", default-features = false }
smallvec = { version = "1.13", default-features = false }
fuse-abi = { version = "0.2.0", default-features = false, features = ["linux", "zerocopy"] }
simple-dns = { version = "0.13.1", default-features = false, features = ["alloc"] }
rangemap = { version = "1.8.0", default-features = false }

[build-dependencies]
flate2 = "1"

[lints]
workspace = true
