[package]
name = "wcontainers-kernel-linux"
description = "A Linux kernel for ARM64 guests, driven as a state machine through wcontainers-abi."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "implementation.rs"

[dependencies]
wcontainers-abi.workspace = true
wcontainers-kernel = { path = "../.." }
wcontainers-executor = { path = "../../../executor" }
wcontainers-system = { path = "../../../system" }
wcontainers-clock = { path = "../../../clock" }
wcontainers-random-source = { path = "../../../random-source" }
wcontainers-tcp-sockets = { path = "../../../tcp-sockets" }
wcontainers-udp-sockets = { path = "../../../udp-sockets" }
wcontainers-readiness = { path = "../../../readiness" }
wcontainers-internet-protocol = { path = "../../../internet-protocol" }
wcontainers-volatile-bytes = { path = "../../../volatile-bytes" }
zerocopy.workspace = true
etherparse.workspace = true
object = { version = "0.41", default-features = false, features = ["read_core", "elf", "unaligned"] }
siphasher = { version = "1.0.1", default-features = false }
smallvec = { version = "1.13", default-features = false }
fuse-abi = { version = "0.2.0", default-features = false, features = ["linux", "zerocopy"] }
domain = { version = "0.12.3", default-features = false, features = ["alloc"] }
rangemap = { version = "1.8.0", default-features = false }
smallbox = { version = "0.8.9", default-features = false }
spin = { version = "0.10.1", default-features = false, features = ["mutex", "spin_mutex"] }

[dev-dependencies]
wcontainers-kernel-conformance = { path = "../../conformance" }
# The stand-in executor and its test host, which make the kernel the suite runs on.
wcontainers-executor-unicorn = { path = "../../../executor/implementation/unicorn" }
wcontainers-processor-architecture = { path = "../../../processor-architecture" }
wcontainers-processor-architecture-arm64 = { path = "../../../processor-architecture/implementation/arm64" }
wcontainers-byte-sink = { path = "../../../byte-sink" }
wcontainers-byte-source = { path = "../../../byte-source" }

[[test]]
name = "conformance"
path = "conformance.rs"

[build-dependencies]
flate2 = "1"

# TODO: remove this crate's 336 uses of unsafe, then replace this table with `[lints]` `workspace = true`.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
