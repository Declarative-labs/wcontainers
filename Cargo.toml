[workspace]
resolver = "3"
members = ["crates/*", "crates/*/conformance", "crates/*/implementation/*"]
exclude = ["third_party"]

[workspace.metadata.reviewable]
prefix = "wcontainers"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stack1ng/wcontainers"

[workspace.dependencies]
wcontainers-abi = { path = "crates/abi" }
bitflags = { version = "2", default-features = false }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
naga = { version = "30.0.2", default-features = false }
etherparse = { version = "0.21.0", default-features = false }
mitsein = { version = "0.10.0", default-features = false }
itertools = { version = "0.14", default-features = false, features = ["use_alloc"] }

# naga 30.0.2 as published, plus our changes (listed in docs/status-graphics-shaders.md), until upstream has them.
[patch.crates-io]
naga = { path = "third_party/naga" }
# wgpu 30.0.2 with its browser back end passing a render pass's occlusion query set to WebGPU.
wgpu = { path = "third_party/wgpu" }

# No crate of ours writes unsafe code. Every crate inherits these lints with `[lints]` `workspace = true`, which forbids it
# outright. The executors cannot do their job without some (they run generated code, map guest memory and call a
# hypervisor): they have their own `[lints.rust]` table that denies it instead, so that each use must carry its own
# `#[expect(unsafe_code, reason = "..")]` on the smallest item that needs it, and every use is a marked point to review;
# a reason that starts "UNSOUND:" or "UNEXPLAINED:" marks a use nobody has shown sound.
# Every count below is of the lines of the crate's folder's `.rs` files that hold the word `unsafe` outside comments and
# attributes (counted on 2026-11-24 with
# `git grep -nw unsafe HEAD -- '<folder>/*.rs' | grep -vE ':[0-9]+:\s*(//|#\[|#!\[|unsafe_code,|reason = )' | wc -l`).
# Executors that deny it, every use marked:
#   crates/executor/implementation/hardware-virtualization (58)
#   crates/executor/implementation/hardware-virtualization-inside (51; also 6 marked `no_mangle` attributes and 2 marked
#   `global_asm!`, which the count leaves out)
#   crates/executor/implementation/unicorn (13: 2 are text in strings, 1 is in its separate test backend, which denies it too)
#   crates/executor/implementation/host-process (9)
#   crates/executor/implementation/wasmtime (29)
# Bindings crates of the graphics, each one outside API and nothing else, that deny it, every use marked, and export
# only a safe facade:
#   crates/metal/implementation/direct (31)
#   crates/shader-converters/implementation/linked (5)
#   crates/test-window/implementation/appkit (8)
#   crates/test-window/implementation/win32 (4)
#   crates/win32/implementation/windows (15)
# TODO: not yet done; each inherits these lints once it is free of it:
#   crates/directx (1042)
#   crates/direct3d-12 (483)
#   crates/opengl (353)
#   crates/graphics-test (319)
#   crates/graphics-test-forward (184)
#   crates/gpu-webgl (160)
#   crates/nir (113)
#   crates/translator-test (101)
#   crates/shaders (71, in its Windows tests calling real Direct3D)
#   crates/gpu-webgpu (19, in its Windows test calling real Direct3D)
#   crates/internet-protocol/implementation/linux-socket-options (2)
#   crates/route-resolver/conformance (2)
#   crates/tcp-sockets/implementation/host (1)
#   crates/icmp-sockets/conformance (1)
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

# Tests run real programs through the translator and the kernel, so unoptimized builds are too slow to be useful.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
