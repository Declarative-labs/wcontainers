[workspace]
resolver = "3"
members = ["crates/*", "crates/*/conformance", "crates/*/implementation/*"]
exclude = ["third_party"]

[workspace.metadata.reviewable]
prefix = "wcontainers"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stack1ng/wcontainers"

[workspace.dependencies]
wcontainers-abi = { path = "crates/abi" }
bitflags = { version = "2", default-features = false }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
naga = { version = "30.0.2", default-features = false }
etherparse = { version = "0.21.0", default-features = false }
mitsein = { version = "0.10.0", default-features = false }
itertools = { version = "0.14", default-features = false, features = ["use_alloc"] }

# naga 30.0.2 as published, plus our changes (listed in docs/status-graphics-shaders.md), until upstream has them.
[patch.crates-io]
naga = { path = "third_party/naga" }
# wgpu 30.0.2 with its browser back end passing a render pass's occlusion query set to WebGPU.
wgpu = { path = "third_party/wgpu" }

# No crate of ours writes unsafe code, except where a crate cannot do its job without it. Every crate inherits
# these lints with `[lints]` `workspace = true`; a crate that does not has its own `[lints.rust]` table and says why.
# Allowed to write it (the executors: they run generated code, map guest memory and call a hypervisor):
#   crates/executor/implementation/hardware-virtualization
#   crates/executor/implementation/hardware-virtualization-inside
#   crates/executor/implementation/unicorn
#   crates/executor/implementation/wasmtime
# TODO: not yet free of it (uses counted on 2026-11-22); each inherits these lints once it is:
#   crates/wcontainers-directx (1091)
#   crates/wcontainers-direct3d-12 (504)
#   crates/wcontainers-graphics-test (342)
#   crates/kernel/implementation/linux (336)
#   crates/wcontainers-opengl (326)
#   crates/wcontainers-graphics-test-forward (197)
#   crates/wcontainers-gpu-webgl (167)
#   crates/wcontainers-nir (98)
#   crates/wcontainers-shaders (95)
#   crates/internet-protocol/implementation/linux-socket-options (40)
#   crates/wcontainers-gpu-webgpu (30)
#   crates/tcp-sockets/implementation/host (23)
#   crates/wcontainers-translator-test (16)
#   crates/icmp-sockets/conformance (15)
#   crates/udp-sockets/implementation/host (11)
#   crates/wcontainers-direct3d-11 (10)
#   crates/runtime/implementation/single-kernel (7)
#   crates/route-resolver/conformance (4)
#   crates/tcp-sockets/conformance (4)
#   crates/route-resolver/implementation/host (2)
#   crates/wcontainers-arm64 (1)
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

# Tests run real programs through the translator and the kernel, so unoptimized builds are too slow to be useful.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
