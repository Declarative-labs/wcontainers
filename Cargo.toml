[workspace]
resolver = "3"
members = ["crates/*", "crates/*/conformance", "crates/*/implementation/*"]
exclude = ["third_party"]

[workspace.metadata.reviewable]
prefix = "wcontainers"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stack1ng/wcontainers"

[workspace.dependencies]
wcontainers-abi = { path = "crates/abi" }
bitflags = { version = "2", default-features = false }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
naga = { version = "30.0.2", default-features = false }
etherparse = { version = "0.21.0", default-features = false }
mitsein = { version = "0.10.0", default-features = false }

# naga 30.0.2 as published, plus our changes (listed in docs/status-graphics-shaders.md), until upstream has them.
[patch.crates-io]
naga = { path = "third_party/naga" }
# wgpu 30.0.2 with its browser back end passing a render pass's occlusion query set to WebGPU.
wgpu = { path = "third_party/wgpu" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Tests run real programs through the translator and the kernel, so unoptimized builds are too slow to be useful.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
