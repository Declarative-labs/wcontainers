[workspace]
resolver = "3"
members = ["crates/*", "crates/*/conformance", "crates/*/implementation/*"]
exclude = ["third_party"]

[workspace.metadata.reviewable]
prefix = "wcontainers"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stack1ng/wcontainers"

[workspace.dependencies]
wcontainers-abi = { path = "crates/abi" }
bitflags = { version = "2", default-features = false }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
naga = { version = "30.0.2", default-features = false }
etherparse = { version = "0.21.0", default-features = false }
mitsein = { version = "0.10.0", default-features = false }
itertools = { version = "0.14", default-features = false, features = ["use_alloc"] }

# naga 30.0.2 as published, plus our changes (listed in docs/status-graphics-shaders.md), until upstream has them.
[patch.crates-io]
naga = { path = "third_party/naga" }
# wgpu 30.0.2 with its browser back end passing a render pass's occlusion query set to WebGPU.
wgpu = { path = "third_party/wgpu" }

# No crate of ours writes unsafe code. Every crate inherits these lints with `[lints]` `workspace = true`, which forbids it
# outright. The four executors cannot do their job without some (they run generated code, map guest memory and call a
# hypervisor): they have their own `[lints.rust]` table that denies it instead, so that each use must carry its own
# `#[expect(unsafe_code, reason = "..")]` on the smallest item that needs it, and every use is a marked point to review.
# TODO: not yet done (uses counted on 2026-11-22); each inherits these lints once it is free of it, or, for an executor,
# denies it once every use left is marked:
#   crates/wcontainers-directx (1091)
#   crates/wcontainers-direct3d-12 (495)
#   crates/wcontainers-graphics-test (342)
#   crates/kernel/implementation/linux (336)
#   crates/wcontainers-opengl (365, counted on 2026-11-23)
#   crates/wcontainers-graphics-test-forward (197)
#   crates/wcontainers-gpu-webgl (167)
#   crates/wcontainers-nir (109, counted on 2026-11-23)
#   crates/wcontainers-shaders (94)
#   crates/executor/implementation/hardware-virtualization (72, an executor)
#   crates/executor/implementation/hardware-virtualization-inside (57, an executor)
#   crates/executor/implementation/wasmtime (52, an executor)
#   crates/executor/implementation/unicorn (37, an executor)
#   crates/wcontainers-gpu-webgpu (30)
#   crates/executor/implementation/host-process (30, an executor, each marked; 28 build on ARM64, 25 on x86-64)
#   crates/wcontainers-translator-test (16)
#   crates/wcontainers-direct3d-11 (10)
#   crates/internet-protocol/implementation/linux-socket-options (2)
#   crates/route-resolver/conformance (2)
#   crates/tcp-sockets/implementation/host (1)
#   crates/icmp-sockets/conformance (1)
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

# Tests run real programs through the translator and the kernel, so unoptimized builds are too slow to be useful.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
