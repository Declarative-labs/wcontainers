[workspace]
resolver = "3"
members = ["crates/*", "crates/*/conformance", "crates/*/implementation/*"]
exclude = ["third_party"]

[workspace.metadata.reviewable]
prefix = "wcontainers"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stack1ng/wcontainers"

[workspace.dependencies]
wcontainers-abi = { path = "crates/abi" }
bitflags = { version = "2", default-features = false }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
naga = { version = "30.0.2", default-features = false }
etherparse = { version = "0.21.0", default-features = false }
mitsein = { version = "0.10.0", default-features = false }
itertools = { version = "0.14", default-features = false, features = ["use_alloc"] }
# Verus's library, in which the specifications are written; a plain build compiles it and keeps none of the specifications.
vstd = { version = "=0.0.0-2026-11-22-0344", default-features = false, features = ["alloc"] }

# naga 30.0.2 as published, plus our changes (listed in docs/status-graphics-shaders.md), until upstream has them.
[patch.crates-io]
naga = { path = "third_party/naga" }
# wgpu 30.0.2 with its browser back end passing a render pass's occlusion query set to WebGPU.
wgpu = { path = "third_party/wgpu" }

# Unsafe code is banned. A crate that must hold some declares its own lints, denies it, and marks each use with its reason.
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
# Verus builds the specifications under these flags, and a plain build leaves them out.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)", "cfg(verus_keep_ghost_body)", "cfg(verus_only)"] }

# Tests run real programs through the translator and the kernel, so unoptimized builds are too slow to be useful.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
