[workspace]
resolver = "3"
members = ["crates/*", "crates/executor/conformance", "crates/kernel-interface/conformance", "crates/system/conformance", "crates/runtime/conformance", "crates/clock/conformance", "crates/random-source/conformance", "crates/tcp-sockets/conformance", "crates/udp-sockets/conformance", "crates/icmp-sockets/conformance", "crates/raw-sockets/conformance", "crates/route-resolver/conformance", "crates/configurable/conformance"]

[workspace.metadata.reviewable]
prefix = "wcontainers"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stack1ng/wcontainers"

[workspace.dependencies]
wcontainers-abi = { path = "crates/wcontainers-abi" }
bitflags = { version = "2", default-features = false }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }
etherparse = { version = "0.21.0", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Tests run real programs through the translator and the kernel, so unoptimized builds are too slow to be useful.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
