on_process_outgrown = { answer = "past_participle", confidence = 0.9614618968704132, model = "perplexity/pplx-decider-v1.2-20261016" }
on_process_starting = { answer = "present_participle", confidence = 0.978359562151138, model = "perplexity/pplx-decider-v1.2-20261016" }
